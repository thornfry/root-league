# Local Supabase stack for the Root league site (build.md F2, decision 40).
# This file configures `supabase start` on a developer machine and in CI. It
# holds no secret: provider secrets are read from the environment when a
# provider is turned on, and the production project is configured in the
# Supabase dashboard, not here.

project_id = "root-league"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the production project's major version.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Local only. seed.sql adds the dev sign-in flag and placeholder identities
# (commit D1), and is never applied to production.
enabled = true
sql_paths = ["./seed.sql"]

# The site uses no live subscriptions, no file storage and no Edge Functions
# (decisions 42 and 51), so those services stay off to keep the stack small
# and fast to start.
[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Vite's dev server address. Production uses the Railway domain, set in the
# Supabase dashboard (runbook).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Email sign-up is on locally only so the dev sign-in page can create
# `<discord id>@dev.invalid` users on first use (decision 41). The runbook
# turns it off in production.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enabled = true
# No confirmation: the dev sign-in must work without reading a mailbox.
enable_confirmations = false
double_confirm_changes = false

[auth.external.discord]
# Off locally. The real provider is configured in the Supabase dashboard; to
# try it on a local stack, set enabled = true and export these two variables.
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET)"
