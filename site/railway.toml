# Set the Railway service root to / and the config file to /site/railway.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "site/Dockerfile"
watchPatterns = ["/site/**", "/league/**", "/planning/**", "/season-1/**", "/.dockerignore"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
