<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Root League (prototype)</title>
<!--
  Root League website: clickable UX prototype.
  One self-contained file. No build step, no network calls, no libraries.
  Everything external (Discord sign-in, Discord app, Supabase, the pairing worker) is stubbed in this page.
  The pairing generator here is a stand-in for the planned TypeScript port; it follows the same rules.
  Data is saved in this browser's localStorage when available. Use "Reset demo data" in the prototype bar.
-->
<style>
:root {
  --bg: #f6f5f0; --surface: #ffffff; --surface2: #efede5; --text: #1c1b18; --muted: #5f5d55;
  --border: #d6d3c7; --accent: #2c6a3b; --accent-fg: #ffffff; --accent-soft: #e0eee3; --link: #1d5a2d;
  --mil: #9b2a20; --mil-bg: #f8e3df; --ins: #3f4d5e; --ins-bg: #e4e9ef; --reach-bg: #ece6d0; --reach-fg: #4d4420;
  --good: #1b6633; --good-bg: #dcf0e1; --warn: #7a5000; --warn-bg: #fcefc6; --bad: #a0231a; --bad-bg: #fadedb;
  --focus: #1c4fd8; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161714; --surface: #1f201c; --surface2: #292a25; --text: #ecebe4; --muted: #a8a699;
    --border: #3a3b34; --accent: #6dbb7d; --accent-fg: #0f1a12; --accent-soft: #22352a; --link: #8fd19d;
    --mil: #f0a399; --mil-bg: #4a2420; --ins: #b6c3d3; --ins-bg: #2a3440; --reach-bg: #3b3722; --reach-fg: #e3d99e;
    --good: #8fd7a2; --good-bg: #1f3a29; --warn: #f0cf7a; --warn-bg: #3d3216; --bad: #f4a79f; --bad-bg: #482522;
    --focus: #8fb0ff; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; padding-bottom: 76px; }
a { color: var(--link); }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 1.2rem 0 .6rem; }
h2 { font-size: 1.2rem; margin: 1.6rem 0 .6rem; }
h3 { font-size: 1.02rem; margin: 1.1rem 0 .4rem; }
p { margin: .5rem 0; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; left: -9999px; }

/* product header */
.site-head { background: var(--surface); border-bottom: 1px solid var(--border); }
.head-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 800; font-size: 1.15rem; text-decoration: none; color: var(--text); letter-spacing: .01em; }
.brand span { color: var(--accent); }
.nav { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.nav a { padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--text); font-size: .95rem; }
.nav a:hover { background: var(--surface2); }
.nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 650; }
.head-end { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.admin-nav { background: var(--surface2); border-top: 1px solid var(--border); }
.admin-nav .wrap { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding-top: 4px; padding-bottom: 4px; }
.admin-nav b { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }

/* controls */
.btn { font: inherit; font-size: .95rem; min-height: 40px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 650; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.discord { background: #5865f2; border-color: #5865f2; color: #fff; font-weight: 650; }
.btn.discord:hover { background: #4752c4; }
input[type=text], input[type=number], input[type=datetime-local], select, textarea { font: inherit; font-size: 16px; min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); max-width: 100%; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); vertical-align: middle; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
label.field input, label.field select { color: var(--text); }
label.inline { display: inline-flex; gap: 8px; align-items: center; min-height: 40px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }

/* cards and chips */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); margin: 12px 0; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; line-height: 1; padding: 4px 8px; border-radius: 999px; background: var(--surface2); color: var(--text); white-space: nowrap; border: 1px solid transparent; letter-spacing: .02em; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.mil { background: var(--mil-bg); color: var(--mil); }
.chip.ins { background: var(--ins-bg); color: var(--ins); }
.chip.reach { background: var(--reach-bg); color: var(--reach-fg); }
.chip.line { background: transparent; border-color: var(--border); color: var(--muted); }
.fac { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.fac .fname { font-weight: 600; }
.notice { border-radius: 8px; padding: 10px 12px; margin: 12px 0; border: 1px solid var(--border); background: var(--surface2); }
.notice.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.notice.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.notice.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.notice b { color: inherit; }

/* tables */
.tbl-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
pre { margin: 0; padding: 12px; overflow-x: auto; max-width: 100%; font-size: .8rem; line-height: 1.45; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; white-space: pre; }

/* lists */
.ranked { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.ranked li { counter-increment: r; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; background: var(--surface); }
.ranked li::before { content: counter(r); font-weight: 800; color: var(--muted); min-width: 1.4em; text-align: right; }
.ranked li .grow { flex: 1; min-width: 0; }
.ranked li.drag-over { outline: 2px dashed var(--accent); }
.ranked li[draggable=true] { cursor: grab; }
.ranked.compact li { padding: 4px 8px; margin: 4px 0; }
.addgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.addgrid button { text-align: left; }

/* games */
.game-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; overflow: hidden; }
.game-card.void { opacity: .75; }
.game-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.game-head .gno { font-weight: 800; font-size: 1.05rem; }
.seat { display: grid; grid-template-columns: 56px 1fr; gap: 2px 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); align-items: start; }
.seat:last-of-type { border-bottom: 0; }
.seat .sno { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 3px; }
.seat.win { background: var(--good-bg); }
.game-foot { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.progress { height: 14px; background: var(--surface2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .1s linear; }
details { margin: 8px 0; }
summary { cursor: pointer; font-weight: 650; padding: 6px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 6px 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 120px; flex: 1; }
.stat b { display: block; font-size: 1.4rem; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .85rem; }
.empty { text-align: center; padding: 28px 14px; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; margin: 14px 0; }
footer.site-foot { margin-top: 36px; padding: 18px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }

/* fake Discord consent screen (mock of an external site) */
.dsc-page { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: #313338; border-radius: 12px; margin: 16px 0; }
.dsc-card { background: #2b2d31; color: #dbdee1; border-radius: 8px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 8px 30px rgba(0,0,0,.4); font-family: system-ui, sans-serif; }
.dsc-card h2 { color: #fff; margin: 0 0 8px; }
.dsc-card ul { padding-left: 20px; }
.dsc-card .mockline { font-size: .75rem; color: #b5bac1; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
.dsc-card .btn { background: #4e5058; color: #fff; border: 0; }
.dsc-card .btn.discord { background: #5865f2; }

/* ---------- PROTOTYPE chrome: deliberately unlike the product ---------- */
#proto-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #17171a; color: #ffe27a; border-top: 3px dashed #ffe27a; font: 13px/1.3 ui-monospace, Menlo, Consolas, monospace; }
#proto-bar .pb-in { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: nowrap; max-width: 980px; margin: 0 auto; }
#proto-bar .tag { background: #ffe27a; color: #17171a; font-weight: 800; padding: 3px 6px; letter-spacing: .06em; flex: none; }
#proto-bar .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #f5e9b5; }
#proto-bar button, #sheet button, #sheet select, #sheet input, #sheet textarea { font: inherit; }
.pbtn { background: #2d2d33; color: #ffe27a; border: 1px solid #ffe27a; padding: 7px 10px; min-height: 36px; cursor: pointer; border-radius: 0; flex: none; }
.pbtn:hover { background: #3b3b44; }
.pbtn.on { background: #ffe27a; color: #17171a; }
.pbtn .badge { background: #f23f42; color: #fff; padding: 1px 5px; margin-left: 4px; border-radius: 9px; }
#sheet { position: fixed; left: 0; right: 0; bottom: 52px; z-index: 49; background: #17171a; color: #f5e9b5; border-top: 3px dashed #ffe27a; max-height: 72vh; overflow-y: auto; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
#sheet[hidden] { display: none; }
#sheet .sh-in { max-width: 980px; margin: 0 auto; padding: 12px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
#sheet h4 { margin: 0 0 6px; color: #ffe27a; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
#sheet label { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; }
#sheet label.cb { flex-direction: row; align-items: center; gap: 8px; }
#sheet select, #sheet input[type=text] { background: #2d2d33; color: #fff; border: 1px solid #77715a; min-height: 36px; padding: 4px 8px; border-radius: 0; font-size: 14px; width: 100%; }
#sheet .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
#sheet ol { margin: 4px 0; padding-left: 18px; } #sheet li { margin: 3px 0; }
#sheet a { color: #ffe27a; }
#sheet .note { color: #b9b08a; }

/* mock Discord drawer */
#dc { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100vw); z-index: 60; background: #313338; color: #dbdee1; display: flex; flex-direction: column; transform: translateX(105%); visibility: hidden; transition: transform .18s ease, visibility .18s; font-family: system-ui, sans-serif; box-shadow: -6px 0 24px rgba(0,0,0,.45); border-left: 3px dashed #ffe27a; }
#dc.open { transform: none; visibility: visible; }
#dc .dc-top { padding: 10px 12px; background: #2b2d31; border-bottom: 1px solid #1e1f22; display: flex; gap: 8px; align-items: center; }
#dc .dc-top .ch { font-weight: 700; color: #fff; flex: 1; min-width: 0; }
#dc .dc-top .ch small { display: block; font-weight: 400; color: #b5bac1; font-size: 12px; }
#dc .dc-top button { background: #4e5058; color: #fff; border: 0; padding: 6px 10px; min-height: 34px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 14px; }
#dc .dc-id { font-size: 12px; color: #b5bac1; padding: 6px 12px; background: #2b2d31; border-bottom: 1px solid #1e1f22; }
#dc-msgs { flex: 1; overflow-y: auto; padding: 8px 12px; }
.dm { margin: 12px 0; display: grid; grid-template-columns: 36px 1fr; gap: 0 10px; }
.dm .av { width: 36px; height: 36px; border-radius: 50%; background: #5865f2; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.dm .av.bot { background: #248046; }
.dm .who { font-weight: 650; color: #fff; font-size: 15px; }
.dm .who .app { background: #5865f2; color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
.dm .who time { font-weight: 400; color: #949ba4; font-size: 11px; margin-left: 8px; }
.dm .txt { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; font-size: 15px; line-height: 1.4; }
.dm .txt a { color: #00a8fc; }
.dm .txt code { background: #1e1f22; padding: 1px 4px; border-radius: 3px; }
.dm .eph { margin-top: 4px; font-size: 12px; color: #b5bac1; }
.dm.ephemeral .txt { border-left: 3px solid #5865f2; padding-left: 8px; background: #2b2d31; }
.dm .cmdline { color: #b5bac1; font-size: 13px; }
.dm .cmdline b { color: #00a8fc; }
#dc .dc-in { padding: 8px 12px 12px; background: #313338; position: relative; }
#dc-auto { position: absolute; left: 12px; right: 12px; bottom: 100%; background: #2b2d31; border: 1px solid #1e1f22; border-radius: 6px 6px 0 0; max-height: 220px; overflow-y: auto; }
#dc-auto:empty { display: none; }
#dc-auto .hd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #b5bac1; padding: 8px 10px 4px; }
#dc-auto button { display: block; width: 100%; text-align: left; background: transparent; color: #dbdee1; border: 0; padding: 8px 10px; cursor: pointer; font: inherit; font-size: 14px; }
#dc-auto button:hover, #dc-auto button.sel { background: #404249; }
#dc-auto button small { display: block; color: #b5bac1; font-size: 12px; }
#dc-input { width: 100%; background: #383a40; color: #dbdee1; border: 0; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 16px; min-height: 44px; }
#dc .hint { font-size: 12px; color: #949ba4; margin-top: 6px; }

#modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal-back[hidden] { display: none; }
#modal { background: var(--surface); color: var(--text); border-radius: 12px; padding: 18px; max-width: 460px; width: 100%; border: 1px solid var(--border); }
#modal h3 { margin-top: 0; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; z-index: 90; background: #17171a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: .92rem; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; border: 1px solid #ffe27a; }
#toast.show { opacity: 1; }

@media (min-width: 720px) {
  h1 { font-size: 2rem; }
  .seat { grid-template-columns: 70px 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<div id="app"></div>

<!-- Prototype-only chrome. Not part of the product. -->
<div id="sheet" hidden aria-label="Prototype controls"></div>
<div id="proto-bar" role="region" aria-label="Prototype controls (not part of the product)"></div>

<aside id="dc" aria-label="Mock Discord" aria-hidden="true">
  <div class="dc-top"><div class="ch"># league-chat<small>Mock Discord, not part of the product</small></div><button data-act="toggle-dc" aria-label="Close Discord">Close</button></div>
  <div class="dc-id" id="dc-id"></div>
  <div id="dc-msgs" aria-live="polite"></div>
  <div class="dc-in"><div id="dc-auto"></div>
    <div style="display:flex;gap:8px"><input id="dc-input" type="text" autocomplete="off" spellcheck="false" aria-label="Message #league-chat"><button id="dc-send" type="button" style="background:#5865f2;color:#fff;border:0;border-radius:8px;padding:0 14px;font:inherit;cursor:pointer">Send</button></div>
    <div class="hint">Try <b>/result</b> or <b>/mypairings</b>. Choices appear as you type; Tab picks the first.</div></div>
</aside>

<div id="modal-back" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Pure logic: factions, seed data, mock pairing, export formats.
   Nothing here touches the DOM. Everything is mocked in the page.
   ============================================================ */
(function (root) {
'use strict';

/* ---------- Factions: from league/factions.md ---------- */
const FACTIONS = [
  { code: 'cats',     name: 'Marquise de Cat',        type: 'Militant',  reach: 10 },
  { code: 'rats',     name: 'Lord of the Hundreds',   type: 'Militant',  reach: 9 },
  { code: 'badgers',  name: 'Keepers in Iron',        type: 'Militant',  reach: 8 },
  { code: 'moles',    name: 'Underground Duchy',      type: 'Militant',  reach: 8 },
  { code: 'birds',    name: 'Eyrie Dynasties',        type: 'Militant',  reach: 7 },
  { code: 'frogs',    name: 'Lilypad Diaspora',       type: 'Militant',  reach: 7 },
  { code: 'otters',   name: 'Riverfolk Company',      type: 'Insurgent', reach: 5 },
  { code: 'vagabond', name: 'Vagabond',               type: 'Insurgent', reach: 5 },
  { code: 'knaves',   name: 'Knaves of the Deepwood', type: 'Insurgent', reach: 4 },
  { code: 'bats',     name: 'Twilight Council',       type: 'Insurgent', reach: 4 },
  { code: 'crows',    name: 'Corvid Conspiracy',      type: 'Insurgent', reach: 3 },
  { code: 'WA',       name: 'Woodland Alliance',      type: 'Insurgent', reach: 3 },
  { code: 'lizards',  name: 'Lizard Cult',            type: 'Insurgent', reach: 2 }
];
const F = {};
const NAME2CODE = {};
FACTIONS.forEach(f => { F[f.code] = f; NAME2CODE[f.name] = f.code; });
const ALL_CODES = FACTIONS.map(f => f.code);

/* ---------- Seed: season-1/roster.md and season-1/preferences.json ---------- */
const SEED_ROSTER = [
  ['Delaney', 'Confirmed'], ['Alex', 'Confirmed'], ['Matt', 'Confirmed'], ['Nick', 'Confirmed'],
  ['Adam', 'Confirmed'], ['Zach', 'Confirmed'], ['Kyra', 'Confirmed'], ['Anthony', 'Confirmed'],
  ['David', 'Confirmed'], ['Will', 'Confirmed'], ['Chuck', 'Possible'], ['Corey', 'Possible']
];
const SEED_LISTS = {
  Alex: ['Underground Duchy', 'Lord of the Hundreds', 'Woodland Alliance', 'Vagabond', 'Lilypad Diaspora'],
  Will: ['Eyrie Dynasties', 'Underground Duchy', 'Lizard Cult', 'Twilight Council', 'Woodland Alliance'],
  Matt: ['Woodland Alliance', 'Lord of the Hundreds', 'Eyrie Dynasties', 'Underground Duchy', 'Vagabond'],
  David: ['Woodland Alliance', 'Knaves of the Deepwood', 'Vagabond', 'Corvid Conspiracy', 'Underground Duchy', 'Lilypad Diaspora'],
  Delaney: ['Lord of the Hundreds', 'Lizard Cult', 'Underground Duchy', 'Lilypad Diaspora', 'Marquise de Cat'],
  Kyra: ['Knaves of the Deepwood', 'Vagabond', 'Marquise de Cat', 'Underground Duchy', 'Riverfolk Company'],
  Nick: ['Corvid Conspiracy', 'Lizard Cult', 'Woodland Alliance', 'Eyrie Dynasties', 'Marquise de Cat'],
  Adam: ['Marquise de Cat', 'Vagabond', 'Eyrie Dynasties', 'Woodland Alliance'],
  Zach: ['Lord of the Hundreds', 'Twilight Council', 'Marquise de Cat', 'Woodland Alliance', 'Corvid Conspiracy'],

/* ---------- Seeded random numbers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- Table rules (the "mix" is one named constraint) ---------- */
const MIN_REACH = 21;
function tableIssues(codes) {
  const out = [];
  const set = new Set(codes);
  if (set.size < codes.length) out.push('a faction appears twice');
  const reach = codes.reduce((s, c) => s + F[c].reach, 0);
  if (reach < MIN_REACH) out.push('reach is ' + reach + ', needs at least ' + MIN_REACH);
  const mil = codes.filter(c => F[c].type === 'Militant').length;
  if (mil === 0) out.push('no militant faction');
  if (mil === codes.length) out.push('no insurgent faction');
  if (set.has('vagabond') && set.has('knaves')) out.push('Vagabond and Knaves together');
  return out;
}
function tableCost(codes) {
  const iss = tableIssues(codes);
  const reach = codes.reduce((s, c) => s + F[c].reach, 0);
  return iss.length * 100 + (reach < MIN_REACH ? (MIN_REACH - reach) * 5 : 0);
}

/* ---------- Mock pairing generator ----------

   hard-rule check. Seeded: the same lists, settings and seed give the same

function makeTables(N, g, rng) {
  const G = N * g / 4;
  let slots = [];
  for (let k = 0; k < g; k++) slots = slots.concat(shuffle([...Array(N).keys()], rng));
  let tables = [];
  for (let t = 0; t < G; t++) tables.push(slots.slice(t * 4, t * 4 + 4));
  const cost = (tb) => {
    let c = 0;
    const cnt = Array.from({ length: N }, () => new Array(N).fill(0));
    tb.forEach(tab => {
      if (new Set(tab).size < 4) c += 1000;
      for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
        const a = Math.min(tab[i], tab[j]), b = Math.max(tab[i], tab[j]);
        if (a !== b) cnt[a][b]++;
      }
    });
    for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
      c += cnt[a][b] * cnt[a][b];
      if (g > 1 && cnt[a][b] === g) c += 200;
    }
    return c;
  };
  let cur = cost(tables);
  for (let it = 0; it < 6000 && cur > 0; it++) {
    const t1 = Math.floor(rng() * G), t2 = Math.floor(rng() * G);
    if (t1 === t2) continue;
    const s1 = Math.floor(rng() * 4), s2 = Math.floor(rng() * 4);
    const tmp = tables[t1][s1]; tables[t1][s1] = tables[t2][s2]; tables[t2][s2] = tmp;
    const c = cost(tables);
    if (c <= cur) cur = c; else { tables[t2][s2] = tables[t1][s1]; tables[t1][s1] = tmp; }
  }
  return tables;
}
function assignMaps(tables, N, mapCount, rng) {
  const G = tables.length;
  const maps = tables.map((_, i) => i % mapCount);
  const cost = () => {
    let c = 0;
    const per = Array.from({ length: N }, () => new Array(mapCount).fill(0));
    const use = new Array(mapCount).fill(0);
    tables.forEach((tab, t) => { use[maps[t]]++; tab.forEach(p => per[p][maps[t]]++); });
    per.forEach(r => r.forEach(n => { c += 10 * n * (n - 1) / 2; }));
    use.forEach(n => { c += n * n; });
    return c;
  };
  let cur = cost();
  const iters = 12000;
  for (let it = 0; it < iters; it++) {
    const T = 6 * (1 - it / iters);
    const t = Math.floor(rng() * G), old = maps[t];
    maps[t] = Math.floor(rng() * mapCount);
    const c = cost();
    if (c <= cur || rng() < Math.exp(-(c - cur) / Math.max(T, 0.01))) cur = c; else maps[t] = old;
  }
  return maps;
}
function assignFactions(tables, players, g, rng) {
  const G = tables.length;
  const fac = tables.map(() => [null, null, null, null]);
  const cells = players.map(() => []);
  tables.forEach((tab, t) => tab.forEach((p, s) => cells[p].push([t, s])));
  players.forEach((pl, p) => {
    const picks = shuffle(pl.list.slice(0, g), rng);
    cells[p].forEach((c, k) => { fac[c[0]][c[1]] = picks[k]; });
  });
  const rankOf = (p, code) => players[p].list.indexOf(code);
  const tc = (t) => tableCost(fac[t]);
  let T = 25;
  const iters = 20000;
  for (let it = 0; it < iters; it++) {
    T = 25 * Math.pow(0.2 / 25, it / iters);
    const p = Math.floor(rng() * players.length);
    const cs = cells[p];
    if (rng() < 0.6 || players[p].list.length === g) {
      if (cs.length < 2) continue;
      const a = Math.floor(rng() * cs.length);
      let b = Math.floor(rng() * cs.length); if (a === b) continue;
      const [t1, s1] = cs[a], [t2, s2] = cs[b];
      const before = tc(t1) + (t2 !== t1 ? tc(t2) : 0);
      const x = fac[t1][s1]; fac[t1][s1] = fac[t2][s2]; fac[t2][s2] = x;
      const after = tc(t1) + (t2 !== t1 ? tc(t2) : 0);
      const d = after - before;
      if (d > 0 && rng() > Math.exp(-d / T)) { const y = fac[t1][s1]; fac[t1][s1] = fac[t2][s2]; fac[t2][s2] = y; }
    } else {
      const a = Math.floor(rng() * cs.length);
      const [t, s] = cs[a];
      const used = new Set(cs.map(c => fac[c[0]][c[1]]));
      const free = players[p].list.filter(c => !used.has(c));
      if (!free.length) continue;
      const nf = free[Math.floor(rng() * free.length)];
      const old = fac[t][s];
      const before = tc(t) + rankOf(p, old);
      fac[t][s] = nf;
      const after = tc(t) + rankOf(p, nf);

}
function assignSeats(tables, N, rng) {
  const G = tables.length;
  const seatOf = tables.map(() => shuffle([0, 1, 2, 3], rng));
  const cost = () => {
    const cnt = Array.from({ length: N }, () => new Array(4).fill(0));
    tables.forEach((tab, t) => tab.forEach((p, s) => cnt[p][seatOf[t][s]]++));
    let c = 0; cnt.forEach(r => r.forEach(n => { c += n * (n - 1) / 2; }));
    return c;
  };
  let cur = cost();
  for (let it = 0; it < 4000 && cur > 0; it++) {
    const t = Math.floor(rng() * G);
    const a = Math.floor(rng() * 4), b = Math.floor(rng() * 4); if (a === b) continue;
    const x = seatOf[t][a]; seatOf[t][a] = seatOf[t][b]; seatOf[t][b] = x;
    const c = cost();
    if (c <= cur) cur = c; else { seatOf[t][b] = seatOf[t][a]; seatOf[t][a] = x; }
  }
  return { seatOf, cost: cur };
}

/* input: { players:[{id,name,list:[codes]}], gamesEach, maps:[names], seed } */
function generatePairings(inp) {
  const players = inp.players, g = inp.gamesEach, N = players.length;
  const mapCount = inp.maps.length;
  const blocking = [];
  if (N < 4) blocking.push({ kind: 'count', msg: 'At least 4 Confirmed players are needed. There are ' + N + '.' });
  else if ((N * g) % 4 !== 0) blocking.push({ kind: 'count', msg: N + ' players playing ' + g + ' games each need ' + (N * g) + ' seats, which does not divide into tables of 4. Change games each, or the number of Confirmed players.' });
  if (g < 1) blocking.push({ kind: 'count', msg: 'Games each must be at least 1.' });
  if (g > 4) blocking.push({ kind: 'count', msg: g + ' games each cannot give a different seat every game, because a table has 4 seats.' });
  if (mapCount < 1) blocking.push({ kind: 'count', msg: 'Add at least one map in Season settings.' });
  players.forEach(p => {
    if (p.list.length < g) blocking.push({ kind: 'player', playerId: p.id, player: p.name,
      msg: p.name + ' ranks ' + p.list.length + ' faction' + (p.list.length === 1 ? '' : 's') + ' but plays ' + g + ' games, and no faction may repeat. Their list needs at least ' + g + '.' });
  });
  if (blocking.length) return { ok: false, report: { seed: inp.seed, blocking, players: N, gamesEach: g } };

  let best = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    const rng = mulberry32((inp.seed * 1000003 + attempt * 7919) >>> 0);
    const tables = makeTables(N, g, rng);
    const maps = assignMaps(tables, N, mapCount, rng);
    const fac = assignFactions(tables, players, g, rng);
    const viol = fac.reduce((s, row) => s + tableIssues(row).length, 0);
    const seats = assignSeats(tables, N, rng);
    const dup = tables.some(t => new Set(t).size < 4);
    const score = viol * 100 + seats.cost * 50 + (dup ? 1000 : 0);
    if (!best || score < best.score) best = { score, tables, maps, fac, seats, viol, dup };
    if (score === 0) break;
  }
  const order = best.tables.map((_, i) => i).sort((a, b) => best.maps[a] - best.maps[b] || a - b);
  const games = order.map((t, i) => {
    const seats = best.tables[t].map((p, s) => ({ seat: best.seats.seatOf[t][s] + 1, playerId: players[p].id, faction: best.fac[t][s] }))
      .sort((a, b) => a.seat - b.seat);
    return { no: i + 1, mapIdx: best.maps[t], status: 'scheduled', winners: [], seats };
  });
  const report = buildReport(games, players, g, inp.maps, inp.seed);

    const bl = [];
    report.checks.filter(c => c.status === 'fail').forEach(c => { bl.push({ kind: 'rule', msg: c.rule + ': ' + c.detail }); });
    games.forEach(gm => {
      const iss = tableIssues(gm.seats.map(s => s.faction));
      if (iss.length) bl.push({ kind: 'table', game: gm.no,
        players: gm.seats.map(s => (players.find(p => p.id === s.playerId) || {}).name),
        msg: 'Table of game ' + gm.no + ': ' + iss.join('; ') + '.' });
    });
    report.blocking = bl;
    return { ok: false, report };
  }
  return { ok: true, games, report };
}

function buildReport(games, players, g, maps, seed) {
  const byId = {}; players.forEach(p => { byId[p.id] = p; });
  const N = players.length;
  // meetings
  const pair = {};
  const meet = {}; players.forEach(p => { meet[p.id] = {}; });
  games.forEach(gm => {
    const ids = gm.seats.map(s => s.playerId);
    for (let i = 0; i < ids.length; i++) for (let j = 0; j < ids.length; j++) if (i !== j) meet[ids[i]][ids[j]] = (meet[ids[i]][ids[j]] || 0) + 1;
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = [ids[i], ids[j]].sort().join('|'); pair[k] = (pair[k] || 0) + 1;
    }
  });
  const counts = [];
  for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) counts.push(pair[[players[a].id, players[b].id].sort().join('|')] || 0);

  counts.forEach(c => { dist[c] = (dist[c] || 0) + 1; });

  const allGames = counts.filter(c => c === g).length;
  const perPlayerMeet = players.map(p => ({
    player: p.name, id: p.id,
    opponents: Object.keys(meet[p.id]).length,
    repeats: Object.values(meet[p.id]).filter(n => n > 1).length
  }));
  // maps
  const mapRows = players.map(p => {
    const c = {};
    games.forEach(gm => { if (gm.seats.some(s => s.playerId === p.id)) c[gm.mapIdx] = (c[gm.mapIdx] || 0) + 1; });
    const rep = Object.values(c).reduce((s, n) => s + Math.max(0, n - 1), 0);
    return { player: p.name, id: p.id, maps: Object.keys(c).map(k => ({ map: maps[k], n: c[k] })), repeats: rep };
  });
  const mapRepeatTotal = mapRows.reduce((s, r) => s + r.repeats, 0);
  // list ranks
  let offList = 0, repeatFac = 0, seatRepeat = 0;
  const rankRows = players.map(p => {
    const mine = [];
    games.forEach(gm => gm.seats.forEach(s => { if (s.playerId === p.id) mine.push({ game: gm.no, faction: s.faction, rank: p.list.indexOf(s.faction) + 1, seat: s.seat }); }));
    offList += mine.filter(m => m.rank === 0).length;
    repeatFac += mine.length - new Set(mine.map(m => m.faction)).size;
    seatRepeat += mine.length - new Set(mine.map(m => m.seat)).size;
    const avg = mine.length ? mine.reduce((s, m) => s + m.rank, 0) / mine.length : 0;
    return { player: p.name, id: p.id, plays: mine, avg };

  games.forEach(gm => {
    const codes = gm.seats.map(s => s.faction);
    const reach = codes.reduce((s, c) => s + F[c].reach, 0); minReach = Math.min(minReach, reach);
    if (new Set(codes).size < codes.length) dupTable++;
    if (reach < MIN_REACH) lowReach++;
    const mil = codes.filter(c => F[c].type === 'Militant').length;
    if (mil === 0 || mil === 4) noMix++;
    if (codes.includes('vagabond') && codes.includes('knaves')) vk++;
    if (new Set(gm.seats.map(s => s.playerId)).size < 4) badTable++;
  });
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const checks = [
    { rule: 'Four different players at every table', status: badTable ? 'fail' : 'pass', detail: badTable ? plural(badTable, 'table') + ' repeat a player' : 'all ' + games.length + ' tables are four distinct players' },
    { rule: 'Factions only from the player\'s own list', status: offList ? 'fail' : 'pass', detail: offList ? plural(offList, 'off-list play') : 'zero off-list plays' },
    { rule: 'No faction repeated by a player', status: repeatFac ? 'fail' : 'pass', detail: repeatFac ? plural(repeatFac, 'repeat') : 'no repeats' },
    { rule: 'No duplicate faction at a table', status: dupTable ? 'fail' : 'pass', detail: dupTable ? plural(dupTable, 'table') : 'none' },
    { rule: 'Table reach at least ' + MIN_REACH, status: lowReach ? 'fail' : 'pass', detail: 'lowest table has reach ' + minReach },
    { rule: 'At least one militant and one insurgent', status: noMix ? 'fail' : 'pass', detail: noMix ? plural(noMix, 'table') + ' missing a type' : 'every table has both' },
    { rule: 'Never Vagabond with Knaves', status: vk ? 'fail' : 'pass', detail: vk ? plural(vk, 'table') : 'none' },
    { rule: 'Even meetings', status: (mx - mn > 1 || allGames) ? 'fail' : 'pass', detail: 'pairs meet ' + mn + ' to ' + mx + ' times' + (allGames ? '; ' + plural(allGames, 'pair') + ' meet every game' : '') },
    { rule: 'A different seat every game', status: seatRepeat ? 'fail' : 'pass', detail: seatRepeat ? plural(seatRepeat, 'repeat') : 'no repeats' },
    { rule: 'A different map every game', status: mapRepeatTotal ? 'note' : 'pass', detail: mapRepeatTotal ? plural(mapRepeatTotal, 'map repeat') + ' (reported, not blocking)' : 'no repeats' }
  ];
  return {
    seed, players: N, gamesEach: g, games: games.length,
    meetings: { dist, min: mn, max: mx, perPlayer: perPlayerMeet, pairsTotal: counts.length },
    maps: { rows: mapRows, repeats: mapRepeatTotal },
    ranks: { rows: rankRows },
    checks, blocking: []
  };
}

}

/* ---------- discord channel ---------- */

/* ---------- seed ---------- */
function ceilHour(ms) { return Math.ceil(ms / 3600000) * 3600000; }

}
function pairInput(season, seed, trim) {

  if (trim && players.length) { const t = players.find(p => p.name === 'Adam') || players[players.length - 1]; t.list = t.list.slice(0, 2); }

}
function sigOf(season) {

}

    report: res.report, status: 'draft', createdAt: now(), createdBy: actorId, sig: sigOf(season), games: res.games };
  season.runs.push(run);

}
function seed(scenario) {
  const t = Date.now();
  S = { v: 1, nextId: 1, clockOffset: 0, roleRequired: true, persona: { kind: 'visitor', playerName: 'Alex' }, session: { playerId: null },
    ui: { viewSlug: 'season-1', joinResult: null, scenario, dcSeen: 0, barOpen: false, dcOpen: false, lastFail: null, tourOpen: false },
    players: [], seasons: {}, order: ['season-1', 'pilot'], currentSlug: 'season-1', discord: [] };
  SEED_ROSTER.forEach(([name]) => {
    S.players.push({ id: 'p-' + slugify(name), name, discordId: name === 'Will' ? '300000000000000001' : name === 'Chuck' ? '300000000000000002' : '',
      hasLogin: false, isAdmin: name === 'Will', source: 'seed' });
  });
  const s1 = mkSeason('season-1', 'Season 1', { gamesEach: 4, minList: 4, deadline: new Date(ceilHour(t + 6 * DAY + 4 * 3600000)).toISOString() });
  SEED_ROSTER.forEach(([name, status]) => {
    s1.roster.push({ playerId: 'p-' + slugify(name), status: status.toLowerCase(),
      list: SEED_LISTS[name].map(n => NAME2CODE[n]), listStatus: SEED_STATUS[name] === 'Submitted' ? 'submitted' : 'provisional' });
  });
  S.seasons['season-1'] = s1;

  const pilotNames = ['Will', 'Alex', 'Matt', 'David', 'Nick', 'Adam', 'Zach', 'Kyra'];
  const pl = mkSeason('pilot', 'Pilot Season (sample)', { gamesEach: 2, maps: ['Winter', 'Autumn'], minList: 3, deadline: new Date(t - 80 * DAY).toISOString() });
  pilotNames.forEach(n => pl.roster.push({ playerId: 'p-' + slugify(n), status: 'confirmed', list: SEED_LISTS[n].map(x => NAME2CODE[x]), listStatus: 'submitted' }));
  S.seasons.pilot = pl;
  const d = makeDraft(pl, 3, false, 'p-will');
  if (d.ok) {
    d.run.status = 'published'; d.run.createdAt = t - 75 * DAY;
    pl.games = d.run.games.map(g => Object.assign({}, g));
    pl.games.forEach((g, i) => {
      g.status = 'played';
      g.winners = i === 2 ? [g.seats[0].playerId, g.seats[2].playerId] : [g.seats[(i * 3 + 1) % 4].playerId];
      pl.log.push({ id: uid('l'), gameNo: g.no, actorId: 'p-will', actorName: 'Will', action: 'set', winners: g.winners.slice(), at: t - (60 - i * 4) * DAY, via: 'web' });
    });
  }
  S.discord.push({ id: uid('m'), at: t - DAY, kind: 'channel', author: 'Root League', bot: true, text: 'Season 1 faction lists are open. Sign in on the league site and rank your factions before the deadline.' });
  if (scenario === 'mid') seedMid(s1, t);
  S.ui.dcSeen = S.discord.length;

}
function seedMid(s1, t) {
  const d = makeDraft(s1, 11, false, 'p-will');
  if (!d.ok) return;
  d.run.createdAt = t - 3 * DAY;
  publishRunCore(s1, d.run, 'p-will');
  const will = player('p-will');
  const plan = [[1, [1]], [2, [0]], [3, [2, 3]], [4, [3]], [5, [1]], [6, 'void']];
  plan.forEach(([no, w]) => {
    const g = gameByNo(s1, no); if (!g) return;
    if (w === 'void') { enterResultCore(s1, g, [g.seats[0].playerId], will, 'web'); voidCore(s1, g, will); return; }
    enterResultCore(s1, g, w.map(i => g.seats[i].playerId), will, 'web');

}

/* ---------- pairing ---------- */
function publishRunCore(season, run, actorId) {

  season.games = run.games.map(g => JSON.parse(JSON.stringify(g)));

}
A.publishRun = function (runId, force) {
  const season = C(), run = season.runs.find(r => r.id === runId);

  const played = season.games.filter(g => g.status === 'played').length;

  if (run.sig !== sigOf(season) && !force) return { ok: false, stale: true, msg: 'The draft is stale.' };

A.draftOf = function (season) { return season.runs.find(r => r.status === 'draft') || null; };

A.isStale = function (season, run) { return run.sig !== sigOf(season); };
A.pairInput = pairInput; A.makeDraft = makeDraft;

/* ---------- results ---------- */
function enterResultCore(season, game, winnerIds, actor, via) {

  game.status = 'played';
  season.log.push({ id: uid('l'), gameNo: game.no, actorId: actor.id, actorName: actor.name, action: 'set', winners: winnerIds.slice(), at: now(), via: via || 'web' });
  dcPost('Game ' + game.no + ' (' + season.maps[game.mapIdx] + '): winner' + (winnerIds.length > 1 ? 's ' : ' ') + winnerIds.map(playerName).join(', ') + '. Entered by ' + actor.name + (via === 'discord' ? ' with `/result`' : ' on the site') + '.');
}
function voidCore(season, game, actor) {
  game.prevWinners = game.winners.slice();
  game.winners = []; game.status = 'void';
  season.log.push({ id: uid('l'), gameNo: game.no, actorId: actor.id, actorName: actor.name, action: 'void', winners: [], at: now(), via: 'web' });
}
A.enterResult = function (gameNo, winnerIds, actor, via) {
  const season = C();
  if (S.ui.viewSlug !== S.currentSlug && via !== 'discord') { /* archive is read only */ }
  const game = gameByNo(season, gameNo);
  if (!game) return { ok: false, msg: 'There is no game ' + gameNo + '.' };
  if (!actor) return { ok: false, msg: 'Sign in to enter a result.' };
  const admin = !!actor.isAdmin;
  if (!admin && !seatOfPlayer(game, actor.id)) return { ok: false, msg: 'Only players seated at game ' + gameNo + ', or the admin, can enter its result.' };
  if (game.status === 'void') return { ok: false, msg: 'Game ' + gameNo + ' is void. The admin must unvoid it first.' };
  if (!winnerIds.length) return { ok: false, msg: 'Choose at least one winner.' };
  if (winnerIds.some(id => !seatOfPlayer(game, id))) return { ok: false, msg: 'Every winner must be seated at game ' + gameNo + '.' };
  enterResultCore(season, game, winnerIds, actor, via);
  save();
  return { ok: true, msg: 'Result saved for game ' + gameNo + '.' };
};
A.voidGame = function (gameNo) {
  const actor = me(); if (!actor || !actor.isAdmin) return { ok: false, msg: 'Admins only.' };
  const g = gameByNo(C(), gameNo); if (!g) return { ok: false, msg: 'No such game.' };
  voidCore(C(), g, actor); save(); return { ok: true, msg: 'Game ' + gameNo + ' voided.' };
};
A.unvoidGame = function (gameNo) {
  const actor = me(); if (!actor || !actor.isAdmin) return { ok: false, msg: 'Admins only.' };
  const season = C(), g = gameByNo(season, gameNo); if (!g) return { ok: false, msg: 'No such game.' };
  g.winners = (g.prevWinners || []).slice(); g.status = g.winners.length ? 'played' : 'scheduled'; delete g.prevWinners;
  season.log.push({ id: uid('l'), gameNo: g.no, actorId: actor.id, actorName: actor.name, action: 'unvoid', winners: g.winners.slice(), at: now(), via: 'web' });
  save(); return { ok: true, msg: 'Game ' + gameNo + ' unvoided.' };
};
A.standings = function (season) {
  const rows = [];
  season.roster.forEach(r => {
    const mine = season.games.filter(g => g.status !== 'void' && seatOfPlayer(g, r.playerId));
    if (r.status !== 'confirmed' && !mine.length) return;
    const wins = mine.filter(g => g.status === 'played' && g.winners.includes(r.playerId)).length;
    rows.push({ playerId: r.playerId, name: playerName(r.playerId), status: r.status, wins,
      played: mine.filter(g => g.status === 'played').length, left: mine.filter(g => g.status === 'scheduled').length });
  });
  rows.sort((a, b) => b.wins - a.wins || b.played - a.played || a.name.localeCompare(b.name));
  let rank = 0;
  rows.forEach((r, i) => { if (i === 0 || r.wins !== rows[i - 1].wins) rank = i + 1; r.rank = rank; });
  return rows;
};

/* ---------- lists ---------- */
A.validateList = function (season, list) {
  const out = [], pool = poolOf(season);
  if (new Set(list).size < list.length) out.push('A faction appears twice.');
  const off = list.filter(c => !pool.includes(c));
  if (off.length) out.push('Not in this season\'s pool: ' + off.map(c => F[c].name).join(', ') + '.');

};

  const errs = A.validateList(season, list);

};
A.deadlinePassed = season => now() >= Date.parse(season.deadline);

/* ---------- sign-in and join (mock of the `join` Edge Function) ---------- */
A.completeSignIn = function () {
  const du = discordUser();

  const existing = S.players.find(p => p.discordId === du.id && p.hasLogin);
  if (existing) { S.session.playerId = existing.id; S.ui.joinResult = { kind: 'back', name: existing.name }; save(); return; }
  if (!du.inServer) { S.ui.joinResult = { kind: 'refused-server', discord: du.name }; save(); return; }
  if (S.roleRequired && !du.hasRole) { S.ui.joinResult = { kind: 'refused-role', discord: du.name }; save(); return; }
  const seeded = S.players.find(p => p.discordId === du.id && !p.hasLogin);

/* ---------- roster admin ---------- */
A.updatePlayer = function (pid, field, value) {
  const season = C(), p = player(pid), row = rowOf(season, pid);
  if (!p || !row) return;
  if (field === 'name') { const v = String(value).trim(); if (v) p.name = v; }

  const p = { id: uid('p'), name: v, discordId: '', hasLogin: false, isAdmin: false, source: 'seed' };

};
A.removePlayer = function (pid) {
  const season = C();

};

  const joiner = player(joinerId), seeded = player(seededId), season = C();
  if (!joiner || !seeded) return 'Pick a roster row to link to.';
  seeded.discordId = joiner.discordId; seeded.hasLogin = true;
  if (S.session.playerId === joinerId) S.session.playerId = seededId;
  season.roster = season.roster.filter(r => r.playerId !== joinerId);
  S.players = S.players.filter(p => p.id !== joinerId);

};

/* ---------- season admin ---------- */
A.updateSeason = function (field, value) {
  const s = C();
  if (field === 'name') s.name = String(value).trim() || s.name;
  if (field === 'gamesEach') s.gamesEach = Math.max(1, Math.min(8, parseInt(value, 10) || s.gamesEach));
  if (field === 'minList') s.minList = Math.max(1, Math.min(13, parseInt(value, 10) || s.minList));
  if (field === 'deadline') { const t = Date.parse(value); if (!isNaN(t)) s.deadline = new Date(t).toISOString(); }
  save();
};
A.updateMap = function (i, v) { const s = C(); if (String(v).trim()) s.maps[i] = String(v).trim(); save(); };
A.addMap = function () { const s = C(); s.maps.push('Map ' + (s.maps.length + 1)); save(); };
A.removeMap = function (i) {

  if (s.maps.length <= 1) return 'A season needs at least one map.';

};
A.togglePool = function (code, on) {
  const s = C(); let pool = poolOf(s).slice();

  s.pool = pool.length === ALL_CODES.length ? null : pool; save();
};
A.createSeason = function (name, copyRoster) {

  let slug = slugify(v), n = 2; while (S.seasons[slug]) slug = slugify(v) + '-' + (n++);
  const prev = C();
  const s = mkSeason(slug, v, { gamesEach: prev.gamesEach, maps: prev.maps.slice(), pool: prev.pool, minList: prev.minList,
    deadline: new Date(ceilHour(now() + 14 * DAY)).toISOString() });

  S.seasons[slug] = s; S.order.unshift(slug); S.currentSlug = slug; S.ui.viewSlug = slug; save();
};

/* ---------- discord slash commands (mock of the `discord` Edge Function) ---------- */
function myGames(season, pid) { return season.games.filter(g => seatOfPlayer(g, pid)); }
A.myGames = myGames;
A.runCommand = function (text) {
  const du = discordUser(); if (!du) return;
  const season = C();
  const say = t => dcEphemeral(t, du.id);
  S.discord.push({ id: uid('m'), at: now(), kind: 'user', author: du.name, bot: false, text, forId: du.id });
  const pl = discordPlayer();
  const t = text.trim();
  if (/^\/mypairings\b/i.test(t)) {
    if (!pl || !rowOf(season, pl.id)) return say('You are not a player in this league yet. Sign in on the site to join.');
    const gs = myGames(season, pl.id);
    if (!gs.length) return say('You have no games yet. Pairings are not published, or you are not Confirmed.');
    const lines = gs.map(g => {
      const mine = seatOfPlayer(g, pl.id);
      const others = g.seats.filter(s => s.playerId !== pl.id).map(s => playerName(s.playerId)).join(', ');
      const res = g.status === 'void' ? 'void' : g.status === 'played' ? (g.winners.includes(pl.id) ? 'you won' : 'won by ' + g.winners.map(playerName).join(', ')) : 'not played';
      return '**Game ' + g.no + '** ' + season.maps[g.mapIdx] + ', seat ' + mine.seat + ', ' + F[mine.faction].name + ', with ' + others + ' (' + res + ')';
    });
    return say('Your games in ' + season.name + ':\n' + lines.join('\n'));
  }
  const m = t.match(/^\/result\s+(\d+)\s+(.+)$/i);
  if (/^\/result\b/i.test(t) && !m) return say('Usage: `/result game winner [winner2 winner3 winner4]`. Pick the game from the list as you type.');
  if (m) {
    if (!pl || !rowOf(season, pl.id)) return say('You are not a player in this league yet. Sign in on the site to join.');
    const g = gameByNo(season, m[1]);
    if (!g) return say('There is no game ' + m[1] + '.');
    // match winner names against this table, longest first
    let rest = m[2].trim(), ids = [];
    const names = g.seats.map(s => ({ id: s.playerId, n: playerName(s.playerId) })).sort((a, b) => b.n.length - a.n.length);
    while (rest) {
      const hit = names.find(x => rest.toLowerCase().startsWith(x.n.toLowerCase()) && (rest.length === x.n.length || /\s/.test(rest[x.n.length])));
      if (!hit) return say('"' + rest.split(/\s+/)[0] + '" is not seated at game ' + g.no + '. Seated: ' + names.map(x => x.n).join(', ') + '.');
      if (!ids.includes(hit.id)) ids.push(hit.id);
      rest = rest.slice(hit.n.length).trim();
    }
    const r = A.enterResult(g.no, ids, pl, 'discord');
    if (!r.ok) return say(r.msg);
    return say('Recorded: game ' + g.no + ' won by ' + ids.map(playerName).join(', ') + '. If that is wrong, you or another player at the table can run `/result` again, or ask the admin to fix it.');
  }
  say('Unknown command. Try `/result` or `/mypairings`.');
  save();
};
A.resultAutocompleteGames = function () {
  const pl = discordPlayer(); if (!pl) return [];
  const season = C();
  const mine = myGames(season, pl.id).filter(g => g.status === 'scheduled');
  const out = mine.map(g => ({ g, other: false }));
  if (pl.isAdmin) season.games.filter(g => g.status !== 'void' && !seatOfPlayer(g, pl.id) && g.status === 'scheduled').forEach(g => out.push({ g, other: true }));
  return out;
};

/* ---------- lifecycle ---------- */
A.init = function () {
  S = load();
  if (!S) { seed('open'); save(); }
};
A.reset = function (scenario) { seed(scenario || 'open'); save(); };
A.save = save;
A.S = () => S;
Object.assign(A, { now, player, playerName, C, V, rowOf, poolOf, gameByNo, me, isAdmin, role, seatOfPlayer, discordUser, discordPlayer,
  uid, slugify, FAKE_USERS, dcPost, sigOf, DAY });
window.RLS = A;
})();

const S = () => R.S();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const REPO = 'https://github.com/thornfry/root-league/blob/main/';

/* ---------- formatting ---------- */
function fmtDT(ms) { return new Date(ms).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' }); }
function fmtShort(ms) { return new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function fmtCd(ms) {
  if (ms <= 0) return 'now';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return (d ? d + 'd ' : '') + h + 'h ' + mm + 'm';
}
function localInput(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

/* ---------- small components ---------- */
function fac(code) {
  const f = F[code];
  return '<span class="fac"><span class="fname">' + esc(f.name) + '</span><span class="chip ' + (f.type === 'Militant' ? 'mil' : 'ins') + '">' + f.type + '</span><span class="chip reach">Reach ' + f.reach + '</span></span>';
}
const plink = id => '<a href="#/players/' + esc(id) + '">' + esc(playerName(id)) + '</a>';
function stChip(st) { return '<span class="chip ' + (st === 'confirmed' ? 'good' : st === 'possible' ? 'warn' : 'line') + '">' + st.charAt(0).toUpperCase() + st.slice(1) + '</span>'; }
function lsChip(ls) { return '<span class="chip ' + (ls === 'submitted' ? 'good' : 'warn') + '">' + (ls === 'submitted' ? 'Submitted' : 'Provisional') + '</span>'; }
function gStatus(g) { return g.status === 'played' ? '<span class="chip good">Played</span>' : g.status === 'void' ? '<span class="chip bad">Void</span>' : '<span class="chip line">Scheduled</span>'; }
function notice(kind, html) { return '<div class="notice ' + kind + '" role="status">' + html + '</div>'; }
function empty(html) { return '<div class="empty">' + html + '</div>'; }
function cdSpan(ms) { return '<span data-cd="' + ms + '">' + fmtCd(ms - now()) + '</span>'; }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
let modalActs = [];
function modal(title, html, actions) {
  modalActs = actions;
  $('#modal').innerHTML = '<h3>' + esc(title) + '</h3><div>' + html + '</div><div class="row end" style="margin-top:14px">' +
    actions.map((a, i) => '<button class="btn ' + (a.cls || '') + '" data-act="modal" data-i="' + i + '">' + esc(a.label) + '</button>').join('') + '</div>';
  $('#modal-back').hidden = false;
  const b = $('#modal button'); if (b) b.focus();
}
function closeModal() { $('#modal-back').hidden = true; modalActs = []; }

/* ---------- routing ---------- */
function route() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(qs || '') };
}
const go = h => { location.hash = h; };

/* ---------- guards ---------- */
function needSignIn() {
  return '<h1>Sign in needed</h1>' + notice('warn', 'This page is for signed-in players. <a href="#/signin">Sign in with Discord</a>.');
}
function needAdmin() {
  return '<h1>Admins only</h1>' + notice('bad', (me() ? 'Your account is not an admin.' : 'Sign in as an admin to use this page.') + ' <a href="#/">Back to home</a>.');
}
function archiveBanner(s) {
  if (s.slug === S().currentSlug) return '';
  return notice('warn', 'You are viewing <b>' + esc(s.name) + '</b>, an archived season. It is read only. <a href="#" data-act="viewseason" data-slug="' + esc(S().currentSlug) + '">Back to the current season</a>.');
}

/* ---------- header ---------- */
function headerHTML(r) {
  const first = r.parts[0] || '';
  const links = [['', 'Home'], ['players', 'Players'], ['pairings', 'Pairings']];
  if (me()) links.push(['my-list', 'My list']);
  links.push(['seasons', 'Seasons'], ['rules', 'Rules']);
  const nav = links.map(l => '<a href="#/' + l[0] + '"' + (first === l[0] || (l[0] === 'players' && first === 'list') ? ' aria-current="page"' : '') + '>' + l[1] + '</a>').join('');
  const sw = S().order.length > 1 ? '<label class="sr" for="season-sel">Season</label><select id="season-sel" data-chg="viewseason">' +
    S().order.map(sl => '<option value="' + esc(sl) + '"' + (sl === S().ui.viewSlug ? ' selected' : '') + '>' + esc(S().seasons[sl].name) + (sl === S().currentSlug ? ' (current)' : '') + '</option>').join('') + '</select>' : '';
  const u = me();
  const who = u ? '<span class="small">Signed in as <b>' + esc(u.name) + '</b>' + (u.isAdmin ? ' <span class="chip good">Admin</span>' : '') + '</span><button class="btn sm" data-act="signout">Sign out</button>'
    : '<a class="btn discord" href="#/signin">Sign in with Discord</a>';
  let admin = '';
  if (isAdmin()) {
    const al = [['roster', 'Roster'], ['season', 'Season'], ['pairing', 'Pairing'], ['results', 'Results'], ['export', 'Export']];
    admin = '<div class="admin-nav"><div class="wrap"><b>Admin</b><nav class="nav" aria-label="Admin">' +
      al.map(l => '<a href="#/admin/' + l[0] + '"' + (first === 'admin' && r.parts[1] === l[0] ? ' aria-current="page"' : '') + '>' + l[1] + '</a>').join('') + '</nav></div></div>';
  }
  return '<header class="site-head"><div class="wrap head-row"><a class="brand" href="#/">Root <span>League</span></a>' +
    '<nav class="nav" aria-label="Main">' + nav + '</nav><div class="head-end">' + sw + who + '</div></div>' + admin + '</header>';
}

/* ---------- game card ---------- */
function gameCard(g, s, o) {
  o = o || {};
  const codes = g.seats.map(x => x.faction);
  const reach = codes.reduce((a, c) => a + F[c].reach, 0);
  const mil = codes.filter(c => F[c].type === 'Militant').length;
  const seats = g.seats.map(x => {
    const win = g.status === 'played' && g.winners.includes(x.playerId);
    return '<div class="seat' + (win ? ' win' : '') + '"><span class="sno">Seat ' + x.seat + '</span><div>' + plink(x.playerId) +
      (win ? ' <span class="chip good">Winner</span>' : '') + '<br>' + fac(x.faction) + '</div></div>';
  }).join('');
  const res = g.status === 'void' ? 'Void: does not count.' : g.status === 'played' ? 'Winner' + (g.winners.length > 1 ? 's' : '') + ': ' + g.winners.map(plink).join(', ') : 'No result yet.';
  return '<article class="game-card ' + g.status + '"><div class="game-head"><a class="gno" href="#/games/' + g.no + '">Game ' + g.no + '</a><span>' + esc(s.maps[g.mapIdx]) + '</span>' + gStatus(g) +
    '<span class="chip reach">Table reach ' + reach + '</span><span class="chip line">' + mil + ' militant, ' + (4 - mil) + ' insurgent</span></div>' + seats +
    '<div class="game-foot"><span>' + res + '</span>' + (o.noLink ? '' : '<a class="btn sm" href="#/games/' + g.no + '" style="margin-left:auto">Open game</a>') + '</div></article>';
}

/* ---------- pages: public ---------- */
function pHome() {
  const s = V(), cur = s.slug === S().currentSlug;
  const rows = R.standings(s);
  const pub = R.publishedOf(s);
  const played = s.games.filter(g => g.status === 'played').length, total = s.games.filter(g => g.status !== 'void').length;
  const dl = Date.parse(s.deadline), open = now() < dl;
  let next = '';
  if (cur) {
    const role = R.role();
    if (role === 'visitor') next = '<p>Join the league: sign in with your Discord account. You need to be in the league server.</p><a class="btn discord" href="#/signin">Sign in with Discord</a>';
    else {
      const row = rowOf(s, me().id);
      next = '<p>Hi ' + esc(me().name) + '. ' + (row ? 'You are ' + stChip(row.status) + ' with a ' + lsChip(row.listStatus) + ' list.' : 'You are not on this season\'s roster.') + '</p><div class="row"><a class="btn primary" href="#/my-list">' + (open ? 'Edit my list' : 'View my list') + '</a>' +
        (pub ? '<a class="btn" href="#/players/' + esc(me().id) + '">My games</a>' : '') + (isAdmin() ? '<a class="btn" href="#/admin/pairing">Pairing</a>' : '') + '</div>';
    }
  }
  const recent = s.log.filter(l => l.action === 'set').slice().reverse().filter((l, i, a) => a.findIndex(x => x.gameNo === l.gameNo) === i)
    .filter(l => { const g = gameByNo(s, l.gameNo); return g && g.status === 'played'; }).slice(0, 5);
  return archiveBanner(s) + '<h1>' + esc(s.name) + '</h1>' +
    '<p class="muted">A friendly Root league. Players rank factions, the pairings pick the tables, and a win is the only score. <a href="#/rules">Read the rules</a>.</p>' +
    '<div class="stat-row"><div class="stat"><b>' + rows.length + '</b><span>players with games or Confirmed</span></div>' +
    '<div class="stat"><b>' + played + ' of ' + total + '</b><span>games played</span></div>' +
    '<div class="stat"><b>' + (pub ? 'Published' : 'Not yet') + '</b><span>pairings</span></div>' +
    (cur ? '<div class="stat"><b>' + (open ? cdSpan(dl) : 'Locked') + '</b><span>' + (open ? 'until lists lock' : 'lists deadline passed') + '</span></div>' : '') + '</div>' +
    (cur ? '<div class="card">' + next + '</div>' : '') +
    '<h2>Standings</h2>' + standingsTable(rows) +
    '<h2>Recent results</h2>' + (recent.length ? '<div class="card">' + recent.map(l => { const g = gameByNo(s, l.gameNo);
      return '<p><a href="#/games/' + g.no + '">Game ' + g.no + '</a> on ' + esc(s.maps[g.mapIdx]) + ': ' + g.winners.map(plink).join(', ') + ' won. <span class="muted small">Entered by ' + esc(l.actorName) + ', ' + fmtShort(l.at) + '</span></p>'; }).join('') + '</div>'
      : empty('No results yet.'));
}
function standingsTable(rows) {
  if (!rows.length) return empty('No players yet.');
  return '<div class="tbl-wrap"><table><thead><tr><th class="num">#</th><th>Player</th><th class="num">Wins</th><th class="num">Played</th><th class="num">Left</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td class="num">' + r.rank + '</td><td>' + plink(r.playerId) + (r.status !== 'confirmed' ? ' ' + stChip(r.status) : '') + '</td><td class="num"><b>' + r.wins + '</b></td><td class="num">' + r.played + '</td><td class="num">' + r.left + '</td></tr>').join('') + '</tbody></table></div>';
}
function listHTML(list, compact) {
  if (!list.length) return '<p class="muted">No factions ranked yet.</p>';
  return '<ol class="ranked' + (compact ? ' compact' : '') + '">' + list.map(c => '<li><span class="grow">' + fac(c) + '</span></li>').join('') + '</ol>';
}
function canEditList(s, pid) {
  if (s.slug !== S().currentSlug || !me()) return false;
  return isAdmin() || (me().id === pid && !R.deadlinePassed(s));
}
function pPlayers() {
  const s = V();
  return archiveBanner(s) + '<h1>Players</h1><p class="muted">' + esc(s.name) + ': every roster entry, status and ranked list. Lists are public.</p>' +
    '<div class="grid wide">' + s.roster.map(r => '<section class="card" style="margin:0"><div class="row" style="justify-content:space-between"><h3 style="margin:0"><a href="#/players/' + esc(r.playerId) + '">' + esc(playerName(r.playerId)) + '</a></h3><span class="row">' + stChip(r.status) + lsChip(r.listStatus) + '</span></div>' +
      listHTML(r.list, true) + (canEditList(s, r.playerId) ? '<a class="btn sm" href="#/' + (me().id === r.playerId ? 'my-list' : 'list/' + esc(r.playerId)) + '">Edit list</a>' : '') + '</section>').join('') + '</div>';
}
function pPlayer(id) {
  const s = V(), row = rowOf(s, id), p = player(id);
  if (!p || !row) return '<h1>Player not found</h1><p><a href="#/players">Back to players</a></p>';
  const gs = s.games.filter(g => seatOfPlayer(g, id));
  const st = R.standings(s).find(x => x.playerId === id);
  const tr = gs.map(g => { const seat = seatOfPlayer(g, id);
    const res = g.status === 'void' ? '<span class="chip bad">Void</span>' : g.status === 'played' ? (g.winners.includes(id) ? '<span class="chip good">Won</span>' : '<span class="chip line">Lost</span>') : '<span class="chip line">To play</span>';
    return '<tr><td><a href="#/games/' + g.no + '">Game ' + g.no + '</a></td><td>' + esc(s.maps[g.mapIdx]) + '</td><td>Seat ' + seat.seat + '</td><td>' + fac(seat.faction) + '</td><td>' + res + '</td></tr>'; }).join('');
  return archiveBanner(s) + '<p><a href="#/players">All players</a></p><h1>' + esc(p.name) + '</h1><div class="row">' + stChip(row.status) + lsChip(row.listStatus) + (p.isAdmin ? '<span class="chip good">Admin</span>' : '') + '</div>' +
    (st ? '<div class="stat-row"><div class="stat"><b>' + st.wins + '</b><span>wins</span></div><div class="stat"><b>' + st.played + '</b><span>played</span></div><div class="stat"><b>' + st.left + '</b><span>left</span></div></div>' : '') +
    '<h2>Ranked list</h2>' + listHTML(row.list) + (canEditList(s, id) ? '<a class="btn" href="#/' + (me().id === id ? 'my-list' : 'list/' + esc(id)) + '">Edit list</a>' : '') +
    '<h2>Games</h2>' + (gs.length ? '<div class="tbl-wrap"><table><thead><tr><th>Game</th><th>Map</th><th>Seat</th><th>Faction</th><th>Result</th></tr></thead><tbody>' + tr + '</tbody></table></div>' : empty('No games yet. Only Confirmed players are paired, after pairings are published.'));
}
function pPairings(q) {
  const s = V();
  const fp = q.get('player') || '', fm = q.get('map') || '', fs = q.get('status') || '';
  let gs = s.games.slice();
  if (fp) gs = gs.filter(g => seatOfPlayer(g, fp));
  if (fm !== '') gs = gs.filter(g => String(g.mapIdx) === fm);
  if (fs) gs = gs.filter(g => g.status === fs);
  const opts = (arr, sel) => arr.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');
  const inRun = [...new Set(s.games.flatMap(g => g.seats.map(x => x.playerId)))];
  return archiveBanner(s) + '<h1>Pairings</h1>' +
    '<div class="card"><div class="grid"><label class="field">Player<select data-chg="pfilter" id="f-player"><option value="">All players</option>' + opts(inRun.map(id => [id, playerName(id)]), fp) + '</select></label>' +
    '<label class="field">Map<select data-chg="pfilter" id="f-map"><option value="">All maps</option>' + opts(s.maps.map((m, i) => [i, m]), fm) + '</select></label>' +
    '<label class="field">Status<select data-chg="pfilter" id="f-status"><option value="">Any status</option>' + opts([['scheduled', 'Scheduled'], ['played', 'Played'], ['void', 'Void']], fs) + '</select></label></div></div>' +
    (!s.games.length ? empty('No pairings are published yet.' + (isAdmin() && s.slug === S().currentSlug ? ' <a href="#/admin/pairing">Run pairing</a>.' : '')) :
      '<p class="muted small">Showing ' + gs.length + ' of ' + s.games.length + ' games.</p>' + (gs.length ? gs.map(g => gameCard(g, s)).join('') : empty('No games match these filters.')));
}
function canEnter(s, g) {
  return !!me() && s.slug === S().currentSlug && g.status !== 'void' && (isAdmin() || !!seatOfPlayer(g, me().id));
}
function pGame(no) {
  const s = V(), g = gameByNo(s, no);
  if (!g) return '<h1>Game not found</h1><p><a href="#/pairings">Back to pairings</a></p>';
  let form = '';
  const cur = s.slug === S().currentSlug;
  if (!me()) form = notice('', 'Players seated at this game can enter its result after signing in with Discord. <a href="#/signin">Sign in</a>.');
  else if (cur && g.status === 'void' && !isAdmin()) form = notice('warn', 'This game is void. Only the admin can unvoid it.');
  else if (canEnter(s, g)) {
    form = '<form class="card" data-submit="save-result" data-no="' + g.no + '"><h2>' + (g.status === 'played' ? 'Change the result' : 'Enter the result') + '</h2>' +
      '<p class="muted small">Choose every winning player. Each winner counts one full win. Anyone seated here, or the admin, can change it later; every change is logged.</p>' +
      g.seats.map(x => '<label class="inline" style="display:flex"><input type="checkbox" class="wchk" value="' + esc(x.playerId) + '"' + (g.winners.includes(x.playerId) ? ' checked' : '') + '> ' + esc(playerName(x.playerId)) + ' <span class="muted small">' + esc(F[x.faction].name) + '</span></label>').join('') +
      '<div class="row" style="margin-top:8px"><button class="btn primary" type="submit">Save result</button>' + (isAdmin() ? '<button type="button" class="btn danger" data-act="void" data-no="' + g.no + '">Void game</button>' : '') + '</div></form>';
  } else if (cur && me()) form = notice('', 'Only players seated at this game, or the admin, can enter its result.');
  if (cur && isAdmin() && g.status === 'void') form += '<div class="card"><p>This game is void.</p><button class="btn" data-act="unvoid" data-no="' + g.no + '">Unvoid game</button></div>';
  const logs = s.log.filter(l => l.gameNo === g.no).slice().reverse();
  return archiveBanner(s) + '<p><a href="#/pairings">All pairings</a></p><h1>Game ' + g.no + '</h1>' + gameCard(g, s, { noLink: true }) + form +
    '<h2>History</h2>' + (logs.length ? '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Winners</th></tr></thead><tbody>' + logs.map(l => logRow(l, false)).join('') + '</tbody></table></div>' : empty('Nothing logged yet. The log is append only.'));
}
function logRow(l, withGame) {
  return '<tr><td>' + fmtShort(l.at) + '</td><td>' + esc(l.actorName) + (l.via === 'discord' ? ' <span class="chip line">Discord</span>' : '') + '</td>' + (withGame ? '<td><a href="#/games/' + l.gameNo + '">Game ' + l.gameNo + '</a></td>' : '') +
    '<td>' + esc(l.action) + '</td><td>' + (l.winners.length ? l.winners.map(playerName).map(esc).join(', ') : '<span class="muted">none</span>') + '</td></tr>';
}
function pSeasons() {
  return '<h1>Seasons</h1><p class="muted">The archive. The current season is the default everywhere.</p>' + S().order.map(sl => {
    const s = S().seasons[sl], rows = R.standings(s), top = rows.length && rows[0].wins ? rows.filter(r => r.wins === rows[0].wins).map(r => esc(r.name)).join(', ') + ' (' + rows[0].wins + ')' : 'no results yet';
    const played = s.games.filter(g => g.status === 'played').length;
    return '<section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(s.name) + '</h2><span class="chip ' + (sl === S().currentSlug ? 'good' : 'line') + '">' + (sl === S().currentSlug ? 'Current' : 'Archived') + '</span></div>' +
      '<dl class="kv"><dt>Players</dt><dd>' + s.roster.filter(r => r.status !== 'withdrawn').length + '</dd><dt>Games</dt><dd>' + played + ' played of ' + s.games.filter(g => g.status !== 'void').length + '</dd><dt>Most wins</dt><dd>' + top + '</dd><dt>Settings</dt><dd>' + s.gamesEach + ' games each, ' + s.maps.length + ' maps</dd></dl>' +
      '<a class="btn" href="#" data-act="viewseason" data-slug="' + esc(sl) + '">View this season</a></section>';
  }).join('');
}
function pRules() {
  const links = [['league/format.md', 'League format', 'Table size, scoring and how games are played.'], ['league/pairing-rules.md', 'Pairing rules', 'What every set of pairings must satisfy.'],
    ['league/factions.md', 'Factions', 'Every faction with its code, type and reach.'], ['league/how-pairing-works.md', 'How pairing works', 'The steps the pairing tool follows.']];
  return '<h1>Rules</h1><p class="muted">The rules live in the league repository. This site links to them rather than copying them, so there is one source.</p>' +
    '<div class="card">' + links.map(l => '<p><a href="' + REPO + l[0] + '" target="_blank" rel="noopener">' + l[1] + '</a><br><span class="muted small">' + l[2] + '</span></p>').join('') + '</div>' +
    '<h2>Reading the badges</h2><div class="card"><p>' + fac('cats') + '</p><p class="small muted">Type is <b>Militant</b> or <b>Insurgent</b>. Reach is the faction\'s value toward the table total, which must be at least 21 (<a href="' + REPO + 'league/factions.md#reach" target="_blank" rel="noopener">factions, reach</a>).</p></div>';
}

/* ---------- sign in and join ---------- */
function pSignin() {
  const jr = S().ui.joinResult, u = me();
  let out = '';
  if (jr) {
    const k = jr.kind;
    if (k === 'refused-server') out = notice('bad', '<b>You are not in the league\'s Discord server.</b> The Discord account <span class="mono">' + esc(jr.discord) + '</span> is not a member, so you cannot join. Ask the admin for an invite, then try again.');
    else if (k === 'refused-role') out = notice('bad', '<b>You are in the server but do not hold the required role.</b> The account <span class="mono">' + esc(jr.discord) + '</span> needs the league role. Ask the admin to give it to you, then try again.');
    else if (k === 'nodiscord') out = notice('warn', 'No Discord account is selected. In the prototype bar, choose who you are.');
    else if (k === 'linked') out = notice('good', '<b>Welcome, ' + esc(jr.name) + '.</b> Your Discord account is now linked to your existing roster entry. <a href="#/my-list">Check your list</a>.');
    else if (k === 'created') out = notice('good', '<b>You have joined as ' + esc(jr.name) + '.</b> You are on the roster as Possible with an empty, Provisional list. <a href="#/my-list">Rank your factions</a>. The admin will confirm you.');
    else if (k === 'back') out = notice('good', '<b>Welcome back, ' + esc(jr.name) + '.</b> <a href="#/my-list">My list</a>');
  }
  const body = u ? '<p>You are signed in as <b>' + esc(u.name) + '</b>.</p>' : '<div class="card"><h2>Join or sign in</h2><p>Sign in with Discord. You must be a member of the league\'s Discord server' + (S().roleRequired ? ' and hold the league role' : '') + '. If the admin already added you to the roster, signing in links your account to that entry. Otherwise you join as Possible and the admin confirms you.</p><a class="btn discord" href="#/discord/authorize">Continue with Discord</a></div>';
  return '<h1>Sign in and join</h1>' + out + body;
}
function pConsent() {
  const du = R.discordUser();

/* ---------- my list ---------- */
let listDraft = null;
function pMyList(pidParam) {
  if (!me()) return needSignIn();
  const s = C(), pid = pidParam || me().id;
  if (pidParam && !isAdmin()) return needAdmin();
  const row = rowOf(s, pid);
  if (!row) return '<h1>My list</h1>' + notice('warn', 'You are not on ' + esc(s.name) + '\'s roster. Ask the admin to add you.');
  if (!listDraft || listDraft.pid !== pid) listDraft = { pid, list: row.list.slice() };
  const dl = Date.parse(s.deadline), passed = R.deadlinePassed(s), admin = isAdmin();
  const editable = !passed || admin;
  const L = listDraft.list, errs = R.validateList(s, L), dirty = JSON.stringify(L) !== JSON.stringify(row.list);
  const pool = poolOf(s);
  const stale = R.publishedOf(s) && admin;
  const dlBox = !passed ? notice('', '<b>Lists lock ' + fmtDT(dl) + '.</b> Time left: ' + cdSpan(dl) + '.')
    : admin ? notice('warn', 'The lists deadline passed ' + fmtDT(dl) + '. Players are locked out. As admin you can still edit.')
      : notice('bad', '<b>Your list is locked.</b> The deadline passed ' + fmtDT(dl) + '. Ask the admin to change it.');
  const items = L.map((c, i) => '<li draggable="' + (editable ? 'true' : 'false') + '" data-di="' + i + '"><span class="grow">' + fac(c) + '</span>' +
    (editable ? '<button class="btn sm" data-act="list-up" data-i="' + i + '" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>Up</button><button class="btn sm" data-act="list-down" data-i="' + i + '" aria-label="Move down"' + (i === L.length - 1 ? ' disabled' : '') + '>Down</button><button class="btn sm danger" data-act="list-remove" data-i="' + i + '" aria-label="Remove">Remove</button>' : '') + '</li>').join('');
  const avail = pool.filter(c => !L.includes(c));
  return '<h1>' + (pidParam && pid !== me().id ? 'List for ' + esc(playerName(pid)) : 'My list') + '</h1><div class="row">' + stChip(row.status) + lsChip(row.listStatus) + '</div>' + dlBox +
    (stale && !passed ? '' : '') + (admin && R.publishedOf(s) ? notice('warn', 'Pairings are published. Changing a list makes them stale; re-run pairing only if no results are entered.') : '') +
    '<p class="muted">Rank the factions you want to play, best first. You only ever play factions from this list, and never the same one twice. Rank at least <b>' + s.minList + '</b>. The more you rank, the easier it is to build valid tables.</p>' +
    (L.length ? '<ol class="ranked" id="mylist">' + items + '</ol>' : empty('Your list is empty. Add factions below.')) +
    (errs.length ? notice('warn', errs.map(esc).join('<br>')) : notice('good', 'This list is valid (' + L.length + ' factions).')) +
    (editable ? '<div class="row"><button class="btn primary" data-act="list-save"' + (errs.length || !dirty ? ' disabled' : '') + '>Save list</button><button class="btn" data-act="list-reset"' + (dirty ? '' : ' disabled') + '>Discard changes</button></div>' +
      '<h2>Add a faction</h2>' + (avail.length ? '<div class="addgrid">' + avail.map(c => '<button class="btn" data-act="list-add" data-code="' + c + '">' + fac(c) + '</button>').join('') + '</div>' : '<p class="muted">Every faction in the pool is on your list.</p>') : '') +
    '<p class="small muted" style="margin-top:14px">Pool: ' + (s.pool ? plural(pool.length, 'faction') + ' this season' : 'all 13 factions') + '. Drag rows to reorder, or use the buttons.</p>';
}

/* ---------- admin: pairing ---------- */
let pairRun = null;   // {start, dur, seed, trim, timer}
let pairSeed = 1;
function reportHTML(rep, games) {
