  const maps = '<p>' + plural(rep.maps.repeats, 'map repeat') + ' in total. A repeat is reported, not blocking.</p><div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Maps played</th><th class="num">Repeats</th></tr></thead><tbody>' + rep.maps.rows.map(m => '<tr><td>' + esc(m.player) + '</td><td>' + m.maps.map(x => esc(x.map) + (x.n > 1 ? ' x' + x.n : '')).join(', ') + '</td><td class="num">' + m.repeats + '</td></tr>').join('') + '</tbody></table></div>';
  const ranks = '<p>Rank 1 is the top of the player\'s list.</p><div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Factions played (rank)</th><th class="num">Average</th></tr></thead><tbody>' + rep.ranks.rows.map(m => '<tr><td>' + esc(m.player) + '</td><td>' + m.plays.map(x => esc(F[x.faction].name) + ' (' + x.rank + ')').join(', ') + '</td><td class="num">' + m.avg.toFixed(2) + '</td></tr>').join('') + '</tbody></table></div>';
  return '<h3>Rule checks</h3>' + checks + '<details><summary>Meetings</summary>' + meet + '</details><details><summary>Map repeats</summary>' + maps + '</details><details><summary>List ranks</summary>' + ranks + '</details>' +
    (games ? '<details><summary>The ' + games.length + ' games</summary>' + games.map(g => gameCard(g, C(), { noLink: true })).join('') + '</details>' : '');
}
function pAdminPairing() {
  if (!isAdmin()) return needAdmin();
  const s = C();
  const conf = s.roster.filter(r => r.status === 'confirmed').length;
  const draft = R.draftOf(s), pub = R.publishedOf(s);
  const played = s.games.filter(g => g.status === 'played').length;
  const prov = s.roster.filter(r => r.status === 'confirmed' && r.listStatus === 'provisional').length;
  const slots = conf * s.gamesEach;
  const countWarn = slots % 4 !== 0 ? notice('warn', conf + ' Confirmed players x ' + s.gamesEach + ' games is ' + slots + ' seats, which does not fill tables of 4. This run will be infeasible. Change games each or the roster.') : '';
  let ctrl;
  if (pairRun) {
    ctrl = '<div class="card"><h2>Running pairing</h2><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="pg-bar"></div></div><p id="pg-phase" class="muted">Starting</p><p class="small muted">Seed ' + pairRun.seed + '. In the real site this runs in a Web Worker so the page stays usable.</p><button class="btn" data-act="cancel-run">Cancel</button></div>';
  } else {
    ctrl = '<div class="card"><h2>Run pairing</h2><div class="row"><label class="field">Seed<input type="number" id="pair-seed" value="' + pairSeed + '" min="1" style="width:130px"></label><button class="btn" data-act="new-seed" style="align-self:flex-end">New seed</button>' +
      '<button class="btn primary" data-act="run-pair" style="align-self:flex-end">Run pairing</button></div><p class="small muted">The same lists, settings and seed always give the same pairings. Only Confirmed players are paired.</p>' +
      '<div class="notice" style="border:1px dashed #b8a24a;background:var(--warn-bg);color:var(--warn)"><b>Prototype control.</b> <label class="inline"><input type="checkbox" id="pair-trim"' + (S().ui.trim ? ' checked' : '') + ' data-chg="trim"> Simulate infeasible lists (cuts Adam\'s list to 2 factions)</label></div></div>';
  }
  let fail = '';
  const lf = S().ui.lastFail;
  if (lf && !pairRun) fail = '<div class="card"><h2>Run failed: infeasible</h2>' + notice('bad', 'No pairings can be built from these lists and settings. Nothing was saved. The blocking points are below.') +
    '<ul>' + lf.blocking.map(b => '<li>' + esc(b.msg) + (b.players ? ' <span class="muted">Players: ' + b.players.map(esc).join(', ') + '</span>' : '') + '</li>').join('') + '</ul>' +
    (lf.checks ? '<details><summary>Rule checks on the best attempt</summary>' + '<ul style="list-style:none;padding:0">' + lf.checks.map(c => '<li style="margin:6px 0"><span class="chip ' + (c.status === 'pass' ? 'good' : c.status === 'fail' ? 'bad' : 'warn') + '">' + (c.status === 'pass' ? 'Pass' : c.status === 'fail' ? 'Fail' : 'Note') + '</span> ' + esc(c.rule) + ': <span class="muted">' + esc(c.detail) + '</span></li>').join('') + '</ul></details>' : '') +
    '<p class="small muted">Fix: lengthen the lists named above, or change the settings. Seed ' + lf.seed + '.</p></div>';
  let dr = '';
  if (draft) {
    const stale = R.isStale(s, draft);
    dr = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Draft</h2><span class="chip ' + (stale ? 'bad' : 'good') + '">' + (stale ? 'Stale' : 'Up to date') + '</span></div>' +
      '<p class="muted small">Seed ' + draft.seed + ', ' + draft.games.length + ' games for ' + draft.params.players + ' players, made ' + fmtShort(draft.createdAt) + '. Nothing is public until you publish.</p>' +
      (stale ? notice('bad', '<b>This draft is stale.</b> A list, status or setting changed after it was made. Run pairing again, or publish anyway after confirming.') : '') +
      (played ? notice('bad', played + ' game' + (played === 1 ? '' : 's') + ' in the published run already ' + (played === 1 ? 'has' : 'have') + ' winners. Publishing is refused until you void them on the Results page.') : '') +
      '<div class="row"><button class="btn primary" data-act="publish" data-id="' + draft.id + '">' + (stale ? 'Publish stale draft' : 'Publish') + '</button><button class="btn danger" data-act="discard" data-id="' + draft.id + '">Discard</button></div>' + reportHTML(draft.report, draft.games) + '</div>';
  }
  let pb = '';
  if (pub) {
    const changed = pub.sig !== R.sigOf(s);
    pb = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Published run</h2><span class="chip good">Public</span></div><p class="muted small">Seed ' + pub.seed + ', ' + s.games.length + ' games, published ' + fmtShort(pub.publishedAt) + '. ' + played + ' with results. <a href="#/pairings">View pairings</a>.</p>' +
      (changed ? notice('warn', 'A list, status or setting has changed since these pairings were made, so they may be stale.') : '') + '<details><summary>Report</summary>' + reportHTML(pub.report) + '</details></div>';
  }
  return '<h1>Pairing</h1><div class="stat-row"><div class="stat"><b>' + conf + '</b><span>Confirmed players</span></div><div class="stat"><b>' + s.gamesEach + '</b><span>games each</span></div><div class="stat"><b>' + (slots / 4) + '</b><span>games to build</span></div><div class="stat"><b>' + prov + '</b><span>Provisional lists among them</span></div></div>' +
    countWarn + ctrl + fail + dr + pb;
}
const PHASES = [[0, 'Tables and maps'], [30, 'Factions'], [70, 'Seats'], [90, 'Checking the rules']];
function startPair() {
  if (pairRun) return;
  const sd = parseInt(($('#pair-seed') || {}).value, 10) || pairSeed;
  pairSeed = sd; S().ui.trim = !!($('#pair-trim') || {}).checked;
  pairRun = { start: performance.now(), dur: 2600, seed: sd, trim: S().ui.trim };
  pairRun.timer = setInterval(() => {
    const p = Math.min(100, (performance.now() - pairRun.start) / pairRun.dur * 100);
    const bar = $('#pg-bar'), ph = $('#pg-phase');
    if (bar) { bar.style.width = p + '%'; bar.parentNode.setAttribute('aria-valuenow', Math.round(p)); }
    if (ph) ph.textContent = PHASES.filter(x => p >= x[0]).pop()[1] + ' (' + Math.round(p) + '%)';
    if (p >= 100) finishPair();
  }, 80);
  render();
}
function finishPair() {
  const run = pairRun; clearInterval(run.timer); pairRun = null;
  const s = C();
  const d = R.makeDraft(s, run.seed, run.trim, S().session.playerId);
  if (d.ok) { S().ui.lastFail = null; toast('Draft ready. Review the report, then publish.'); }
  else { S().ui.lastFail = d.report; toast('Run failed: infeasible. Nothing was saved.'); }
  R.save(); render();
}

/* ---------- render ---------- */
function pageHTML(r) {
  const [a, b] = r.parts;
  switch (a) {
    case undefined: return pHome();
    case 'players': return b ? pPlayer(b) : pPlayers();
    case 'pairings': return pPairings(r.q);
    case 'games': return pGame(b);
    case 'seasons': return pSeasons();
    case 'rules': return pRules();
    case 'signin': return pSignin();
    case 'discord': return pConsent();
    case 'my-list': return pMyList();
    case 'list': return pMyList(b);
    case 'admin':
      if (b === 'roster') return pAdminRoster();
      if (b === 'season') return pAdminSeason();
      if (b === 'pairing') return pAdminPairing();
      if (b === 'results') return pAdminResults();
      if (b === 'export') return pAdminExport();
      return needAdmin();
    default: return '<h1>Page not found</h1><p><a href="#/">Home</a></p>';
  }
}
let lastRouteKey = '';
function render() {
  const r = route();
  const key = r.parts.join('/');
  if (key !== lastRouteKey) { if (!(r.parts[0] === 'my-list' || r.parts[0] === 'list')) listDraft = null; lastRouteKey = key; window.scrollTo(0, 0); }
  $('#app').innerHTML = headerHTML(r) + '<main class="wrap" id="main">' + pageHTML(r) +
    '<footer class="site-foot">Root League. Rules and data live in the <a href="https://github.com/thornfry/root-league" target="_blank" rel="noopener">league repository</a>.</footer></main>';
  document.title = 'Root League (prototype)';
  renderBar(); renderDiscord();
}

  ['visitor', 'Signed-out visitor'], ['nonmember', 'Discord user not in the server'], ['norole', 'Server member without the league role'],
  ['newmember', 'Server member, new to the league'], ['linkme', 'Server member matching a seeded row (Chuck)'], ['player', 'A seeded player'], ['admin', 'Will, admin']
];
function personaSummary() {
  const u = me(), du = R.discordUser();
  if (u) return u.name + (u.isAdmin ? ' (admin)' : ' (player)');
  return du ? du.name + ', signed out' : 'visitor, signed out';
}
function renderBar() {
  const st = S(), open = st.ui.barOpen, unread = st.discord.slice(st.ui.dcSeen).filter(m => m.kind === 'channel').length;
  $('#proto-bar').innerHTML = '<div class="pb-in"><span class="tag">PROTOTYPE</span><span class="who" title="Not part of the product">' + esc(personaSummary()) + '</span>' +
    '<button class="pbtn' + (open ? ' on' : '') + '" data-act="toggle-bar" aria-expanded="' + open + '" aria-controls="sheet">Controls</button>' +
    '<button class="pbtn' + (st.ui.dcOpen ? ' on' : '') + '" data-act="toggle-dc" aria-expanded="' + st.ui.dcOpen + '">Discord' + (unread && !st.ui.dcOpen ? '<span class="badge">' + unread + '</span>' : '') + '</button></div>';
  const sh = $('#sheet'); sh.hidden = !open;
  if (!open) return;
  const p = st.persona, cur = C();
  const sc = $('#sc-sel') ? $('#sc-sel').value : st.ui.scenario;
  sh.innerHTML = '<div class="sh-in"><div><h4>Who you are</h4><p class="note">Prototype only. Not part of the product.</p>' +
    '<label>Persona<select data-chg="persona">' + PERSONAS.map(x => '<option value="' + x[0] + '"' + (p.kind === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>' +
    (p.kind === 'player' ? '<label>Which player<select data-chg="persona-player">' + cur.roster.map(r => playerName(r.playerId)).map(n => '<option' + (p.playerName === n ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></label>' : '') +
    '<p>Now: <b>' + esc(personaSummary()) + '</b></p>' +
    (['visitor'].includes(p.kind) || me() ? '' : '<p class="note">Signed out. Use "Sign in with Discord" on the page to try the join.</p>') +
    '<label class="cb"><input type="checkbox" data-chg="role-required"' + (st.roleRequired ? ' checked' : '') + '> Server requires a league role to join</label>' +
    '<div class="btnrow"><button class="pbtn" data-act="signout">Sign out</button></div></div>' +
    '<div><h4>Time</h4><p>Simulated now: <b>' + fmtShort(now()) + '</b><br>Lists deadline: <b>' + fmtShort(Date.parse(cur.deadline)) + '</b> (' + (R.deadlinePassed(cur) ? 'passed' : 'open') + ')</p>' +
    '<div class="btnrow"><button class="pbtn" data-act="time-add" data-ms="3600000">+1 hour</button><button class="pbtn" data-act="time-add" data-ms="86400000">+1 day</button><button class="pbtn" data-act="time-deadline">Jump past deadline</button><button class="pbtn" data-act="time-real">Back to real time</button></div></div>' +
    '<div><h4>Demo data</h4><label>Starting point<select id="sc-sel"><option value="open"' + (sc === 'open' ? ' selected' : '') + '>Lists open, no pairings yet</option><option value="mid"' + (sc === 'mid' ? ' selected' : '') + '>Mid-season: pairings published, results in</option></select></label>' +
    '<div class="btnrow"><button class="pbtn" data-act="reset">Reset demo data</button></div><p class="note">Saved in this browser (localStorage) when available.</p></div>' +
    '<div><h4>Try this</h4><ol><li>Persona "Server member, new": sign in, join, edit the list.</li><li>Persona "Will, admin": Roster, then Pairing, run and publish.</li><li>Persona "A seeded player": open a game and enter a result.</li><li>Open Discord: type <span class="mono">/result</span> and <span class="mono">/mypairings</span>.</li><li>Admin Export: copy the three files.</li><li>Jump past the deadline and look at My list.</li></ol></div></div>';
}

/* ---------- mock Discord ---------- */
let dcItems = [], dcSel = -1;
function dcFmt(t) {
  return esc(t).replace(/\[([^\]]+)\]\((#[^)]+)\)/g, '<a href="$2" data-act="dc-link">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
}
function renderDiscord() {
  const st = S(), du = R.discordUser(), dp = R.discordPlayer();
  $('#dc').classList.toggle('open', st.ui.dcOpen);
  $('#dc').setAttribute('aria-hidden', st.ui.dcOpen ? 'false' : 'true');
  if (st.ui.dcOpen) st.ui.dcSeen = st.discord.length;
  $('#dc-id').textContent = du ? 'You are ' + du.name + (dp ? ' (player: ' + dp.name + ')' : du.inServer ? ' (in the server, not a player yet)' : ' (not in this server)') : 'No Discord account. Choose a persona in the prototype bar.';
  const msgs = st.discord.filter(m => m.kind !== 'ephemeral' || (du && m.forId === du.id));
  $('#dc-msgs').innerHTML = msgs.map(m => {
    if (m.kind === 'user') return '<div class="dm"><div class="av">' + esc(m.author.charAt(0).toUpperCase()) + '</div><div><div class="who">' + esc(m.author) + '<time>' + fmtShort(m.at) + '</time></div><div class="cmdline">used <b>' + esc(m.text.split(/\s/)[0]) + '</b></div><div class="txt mono" style="font-size:13px;color:#b5bac1">' + esc(m.text) + '</div></div></div>';
    return '<div class="dm' + (m.kind === 'ephemeral' ? ' ephemeral' : '') + '"><div class="av bot">RL</div><div><div class="who">Root League<span class="app">APP</span><time>' + fmtShort(m.at) + '</time></div><div class="txt">' + dcFmt(m.text) + '</div>' +
      (m.kind === 'ephemeral' ? '<div class="eph">Only you can see this</div>' : '') + '</div></div>';
  }).join('') || '<p style="color:#949ba4">No messages yet.</p>';
  const box = $('#dc-msgs'); box.scrollTop = box.scrollHeight;
  $('#dc-input').disabled = !du; $('#dc-input').placeholder = du ? 'Type / for commands' : 'Choose a Discord persona first';
}
function parseWinners(game, rest) {
  const names = game.seats.map(s => ({ id: s.playerId, n: playerName(s.playerId) })).sort((a, b) => b.n.length - a.n.length);
  const ids = []; rest = rest.replace(/^\s+/, '');
  for (;;) {
    const hit = names.find(x => rest.toLowerCase().startsWith(x.n.toLowerCase()) && (rest.length === x.n.length ? false : /\s/.test(rest[x.n.length])));
    if (!hit) break;
    if (!ids.includes(hit.id)) ids.push(hit.id);
    rest = rest.slice(hit.n.length).replace(/^\s+/, '');
  }
  return { ids, partial: rest, names };
}
function dcCompute(v) {
  dcItems = []; let hdr = '';
  if (!R.discordUser() || v.charAt(0) !== '/') return { hdr: '' };
  const cmd = v.match(/^\/(\S*)$/);
  if (cmd) {
    hdr = 'Commands';
    [['/result', 'Report the winner or winners of a game'], ['/mypairings', 'List your games, opponents and results']].filter(c => c[0].startsWith('/' + cmd[1].toLowerCase())).forEach(c => dcItems.push({ label: c[0], sub: c[1], ins: c[0] === '/result' ? '/result ' : '/mypairings' }));
    return { hdr };
  }
  const g1 = v.match(/^\/result\s+(\d*)$/i);
  if (g1) {
    hdr = 'game: your unplayed games';
    const s = C();
    R.resultAutocompleteGames().filter(x => String(x.g.no).startsWith(g1[1])).forEach(x => dcItems.push({ label: 'Game ' + x.g.no + ', ' + s.maps[x.g.mapIdx], sub: x.g.seats.map(t => playerName(t.playerId)).join(', ') + (x.other ? ' (another table, admin only)' : ''), ins: '/result ' + x.g.no + ' ' }));
    if (!dcItems.length) hdr = 'No unplayed games for you' + (C().games.length ? '' : ' (pairings are not published)');
    return { hdr };
  }
  const g2 = v.match(/^\/result\s+(\d+)\s([\s\S]*)$/i);
  if (g2) {
    const g = gameByNo(C(), g2[1]); if (!g) return { hdr: 'No such game' };
    const pw = parseWinners(g, g2[2]);
    hdr = pw.ids.length ? 'winner2, winner3, winner4 (optional). Enter to send.' : 'winner: who won game ' + g.no;
    pw.names.filter(n => !pw.ids.includes(n.id) && n.n.toLowerCase().startsWith(pw.partial.toLowerCase())).forEach(n => {
      const seat = seatOfPlayer(g, n.id);
      dcItems.push({ label: n.n, sub: F[seat.faction].name + ', seat ' + seat.seat, ins: v.slice(0, v.length - pw.partial.length) + n.n + ' ' });
    });
    return { hdr, complete: pw.ids.length > 0 && pw.partial === '' };
  }
  return { hdr: '' };
}
function renderAuto() {
  const v = $('#dc-input').value, c = dcCompute(v);
  dcSel = Math.min(dcSel, dcItems.length - 1);
  $('#dc-auto').innerHTML = dcItems.length || c.hdr ? '<div class="hd">' + esc(c.hdr) + '</div>' + dcItems.map((it, i) => '<button type="button" data-act="dcpick" data-i="' + i + '" class="' + (i === dcSel ? 'sel' : '') + '">' + esc(it.label) + '<small>' + esc(it.sub) + '</small></button>').join('') : '';
  return c;
}
function dcPick(i) {
  const it = dcItems[i]; if (!it) return;
  const inp = $('#dc-input'); inp.value = it.ins; inp.focus(); dcSel = -1; renderAuto();
  if (it.ins === '/mypairings') { /* wait for Enter */ }
}
function dcSend() {
  const inp = $('#dc-input'), v = inp.value.trim(); if (!v) return;
  inp.value = ''; dcSel = -1; renderAuto();
  if (v.charAt(0) !== '/') { return; }
  R.runCommand(v); R.save(); render();
}

/* ---------- events ---------- */
const ACT = {
  'toggle-bar': () => { S().ui.barOpen = !S().ui.barOpen; render(); },
  'toggle-dc': () => { S().ui.dcOpen = !S().ui.dcOpen; render(); if (S().ui.dcOpen) setTimeout(() => $('#dc-input').focus(), 220); },
  'dc-link': () => { if (window.innerWidth < 720) { S().ui.dcOpen = false; render(); } },
  signout: () => { R.signOut(); render(); toast('Signed out.'); go('#/'); },
  authorize: () => { R.completeSignIn(); go('#/signin'); render(); },
  viewseason: t => { S().ui.viewSlug = t.dataset.slug; R.save(); go('#/'); render(); },
  'list-up': t => { const i = +t.dataset.i, L = listDraft.list; [L[i - 1], L[i]] = [L[i], L[i - 1]]; render(); },
  'list-down': t => { const i = +t.dataset.i, L = listDraft.list; [L[i + 1], L[i]] = [L[i], L[i + 1]]; render(); },
  'list-remove': t => { listDraft.list.splice(+t.dataset.i, 1); render(); },
  'list-add': t => { listDraft.list.push(t.dataset.code); render(); },
  'list-reset': () => { listDraft = null; render(); },
  'list-save': () => { const r = R.saveList(listDraft.pid, listDraft.list); toast(r.msg); if (r.ok) listDraft = null; render(); },
  void: t => { const no = t.dataset.no; modal('Void game ' + no + '?', '<p>A void game does not count toward standings. Its winners are kept so an unvoid can restore them. This is logged.</p>', [{ label: 'Cancel' }, { label: 'Void game', cls: 'danger', fn: () => { toast(R.voidGame(no).msg); render(); } }]); },
  unvoid: t => { toast(R.unvoidGame(t.dataset.no).msg); render(); },
  'run-pair': () => startPair(),
  'cancel-run': () => { clearInterval(pairRun.timer); pairRun = null; toast('Run cancelled. Nothing was saved.'); render(); },
  'new-seed': () => { pairSeed = Math.floor(Math.random() * 9000) + 1; render(); },
  publish: t => {
    const r = R.publishRun(t.dataset.id, false);
    if (r.stale) { modal('Publish a stale draft?', '<p>A list, status or setting changed after this draft was made, so it may no longer fit the current data. Publish it anyway?</p>', [{ label: 'Cancel' }, { label: 'Publish anyway', cls: 'danger', fn: () => { const x = R.publishRun(t.dataset.id, true); toast(x.msg); render(); } }]); return; }
    toast(r.msg); render();
  },
  discard: t => { R.discardRun(t.dataset.id); toast('Draft discarded.'); render(); },
  'link-player': t => { const sel = $('#link-' + t.dataset.pid), v = sel && sel.value; const e = R.linkPlayer(t.dataset.pid, v); toast(e || 'Linked. The joiner\'s login now belongs to the seeded entry.'); render(); },
  'remove-player': t => { const p = player(t.dataset.pid); modal('Remove ' + p.name + '?', '<p>This removes them from the season roster and deletes their list.</p>', [{ label: 'Cancel' }, { label: 'Remove', cls: 'danger', fn: () => { const e = R.removePlayer(t.dataset.pid); toast(e || 'Removed.'); render(); } }]); },
  'add-player': () => { const e = R.addPlayer($('#add-name').value); toast(e || 'Added as Possible.'); render(); },
  'add-map': () => { R.addMap(); render(); },
  'remove-map': t => { const e = R.removeMap(+t.dataset.i); if (e) toast(e); render(); },
  'create-season': () => { const e = R.createSeason($('#new-season').value, $('#copy-roster').checked); toast(e || 'Season created and set as current.'); render(); },
  copy: t => {
    const txt = exportTexts()[t.dataset.f];
    const done = () => toast('Copied ' + t.dataset.f);
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed. Select the text instead.'); } ta.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  },
  download: t => { const txt = exportTexts()[t.dataset.f], a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' })); a.download = t.dataset.f; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded ' + t.dataset.f); },
  'time-add': t => { S().clockOffset += +t.dataset.ms; R.save(); render(); },
  'time-deadline': () => { S().clockOffset = Date.parse(C().deadline) - Date.now() + 60000; R.save(); render(); toast('Time moved one minute past the lists deadline.'); },
  'time-real': () => { S().clockOffset = 0; R.save(); render(); },
  reset: () => { const sc = $('#sc-sel').value; R.reset(sc); S().ui.barOpen = true; listDraft = null; pairRun && clearInterval(pairRun.timer); pairRun = null; go('#/'); render(); toast('Demo data reset.'); },
  dcpick: t => dcPick(+t.dataset.i),
  modal: t => { const a = modalActs[+t.dataset.i]; closeModal(); if (a && a.fn) a.fn(); }
};
const CHG = {
  persona: t => { R.setPersona(t.value); render(); },
  'persona-player': t => { R.setPersona('player', t.value); render(); },
  'role-required': t => { S().roleRequired = t.checked; R.save(); render(); },
  viewseason: t => { S().ui.viewSlug = t.value; R.save(); render(); },
  pfilter: () => { const p = $('#f-player').value, m = $('#f-map').value, st = $('#f-status').value; const q = []; if (p) q.push('player=' + encodeURIComponent(p)); if (m !== '') q.push('map=' + m); if (st) q.push('status=' + st); location.hash = '#/pairings' + (q.length ? '?' + q.join('&') : ''); },
  rost: t => { const f = t.dataset.f, v = t.type === 'checkbox' ? t.checked : t.value; const e = R.updatePlayer(t.dataset.pid, f, v); if (e) toast(e); else toast('Saved.'); render(); },
  sset: t => { R.updateSeason(t.dataset.f, t.value); toast('Saved.'); render(); },
  map: t => { R.updateMap(+t.dataset.i, t.value); render(); },
  pool: t => { R.togglePool(t.dataset.code, t.checked); render(); },
  trim: t => { S().ui.trim = t.checked; R.save(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = ACT[t.dataset.act]; if (!a) return;
  if (t.tagName === 'A' && t.dataset.act === 'viewseason') e.preventDefault();
  a(t, e);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault();
  if (f.dataset.submit === 'save-result') {
    const ids = [...f.querySelectorAll('.wchk:checked')].map(x => x.value);
    const r = R.enterResult(f.dataset.no, ids, me(), 'web'); toast(r.msg); render();
  }
});
// drag and drop for the list editor
let dragFrom = null;
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('li[data-di]'); if (!li || li.draggable !== true) return; dragFrom = +li.dataset.di; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (x) { /* ignore */ } });
document.addEventListener('dragover', e => { const li = e.target.closest && e.target.closest('li[data-di]'); if (li && dragFrom !== null) { e.preventDefault(); document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); li.classList.add('drag-over'); } });
document.addEventListener('drop', e => {
  const li = e.target.closest && e.target.closest('li[data-di]'); if (!li || dragFrom === null || !listDraft) return; e.preventDefault();
  const to = +li.dataset.di, L = listDraft.list, [m] = L.splice(dragFrom, 1); L.splice(to, 0, m); dragFrom = null; render();
});
document.addEventListener('dragend', () => { dragFrom = null; document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal-back').hidden) closeModal(); else if (S().ui.dcOpen) { S().ui.dcOpen = false; render(); } } });
$('#modal-back').addEventListener('click', e => { if (e.target.id === 'modal-back') closeModal(); });
// discord input
(function () {
  const inp = $('#dc-input');
  inp.addEventListener('input', () => { dcSel = -1; renderAuto(); });
  inp.addEventListener('focus', () => renderAuto());
  inp.addEventListener('keydown', e => {
    const c = renderAuto();
    if (e.key === 'ArrowDown' && dcItems.length) { e.preventDefault(); dcSel = (dcSel + 1) % dcItems.length; renderAuto(); }
    else if (e.key === 'ArrowUp' && dcItems.length) { e.preventDefault(); dcSel = (dcSel <= 0 ? dcItems.length : dcSel) - 1; renderAuto(); }
    else if (e.key === 'Tab' && dcItems.length) { e.preventDefault(); dcPick(dcSel < 0 ? 0 : dcSel); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const v = inp.value.trim();
      const done = /^\/mypairings$/i.test(v) || c.complete;
      if (dcItems.length && !done) dcPick(dcSel < 0 ? 0 : dcSel); else dcSend();
    }
  });
  $('#dc-send').addEventListener('click', () => { const v = inp.value.trim(); if (dcItems.length && !/^\/mypairings$/i.test(v) && !renderAuto().complete) dcPick(dcSel < 0 ? 0 : dcSel); else dcSend(); });
})();
setInterval(() => document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = fmtCd(+el.dataset.cd - now()); }), 1000);
window.addEventListener('hashchange', render);

/* ---------- start ---------- */
R.init();
if (!location.hash) history.replaceState(null, '', '#/');
render();
window.__proto = { render, go };
})();

</script>
