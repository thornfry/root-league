<head>

<title>Root League (prototype)</title>
<!--
  Root League website: clickable UX prototype, version 2.
  One self-contained file. No build step, no libraries, no network calls except the Google Fonts stylesheet.
  Built from the approved user stories (planning/website/user-stories.md), the design canvas, and the later decisions in planning/website/decisions.md (26 to 28).
  Discord sign-in, Supabase and the faction step are stubbed in this page. League info text is the repo's league/*.md, embedded.
  Data is saved in this browser's localStorage when available. Use "Reset data" in the purple prototype bar at the foot of the page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Root League: tokens and components from the design canvas (league.css), plus the app's page layout. */
:root {
  --paper: #EEF0EA; --card: #FFFFFF; --ink: #15201B; --ink2: #46544C; --line: #D3D9D0; --line2: #B3BDB0;

  --blue: #2F4858; --blue-wash: #DDE8EE; --link: #1D4B38; --adm: #15201B; --band-line: #8FA699; --sel: #1D4B38;
  --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0F1713; --card: #17211C; --ink: #E8EFEA; --ink2: #A9B8AE; --line: #2A3831; --line2: #4A5C52;
    --forest: #2E7B58; --forest-wash: #1F3A2D; --clay: #F0A08A; --clay-wash: #3C211A; --ok: #86D6A8; --ok-wash: #173A27; --warn: #F2C56A; --warn-wash: #3B2D0C; --warn-ink: #F6D58E;
    --blue: #A6CBE0; --blue-wash: #1A2D39; --link: #8FD1AE; --adm: #E8EFEA; --sel: #5FBF8E; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0F1713; --card: #17211C; --ink: #E8EFEA; --ink2: #A9B8AE; --line: #2A3831; --line2: #4A5C52;
  --forest: #2E7B58; --forest-wash: #1F3A2D; --clay: #F0A08A; --clay-wash: #3C211A; --ok: #86D6A8; --ok-wash: #173A27; --warn: #F2C56A; --warn-wash: #3B2D0C; --warn-ink: #F6D58E;
  --blue: #A6CBE0; --blue-wash: #1A2D39; --link: #8FD1AE; --adm: #E8EFEA; --sel: #5FBF8E; color-scheme: dark; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); }
.lg { font-family: var(--f-body); color: var(--ink); background: var(--paper); font-size: 15px; line-height: 1.5; box-sizing: border-box; min-height: 100vh; }
.lg *, .lg *::before, .lg *::after { box-sizing: border-box; }
.lg h1, .lg h2, .lg h3, .lg p { margin: 0; }

.num { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }

.reach { font-size: 12px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.seal { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; flex: none; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; color: #fff; background: #555; }
.seal.lg2 { width: 40px; height: 40px; font-size: 19px; border-radius: 9px; }
.seal.cats { background: #E8742A; color: #15201B; } .seal.rats { background: #B5432E; } .seal.badgers { background: #6B6F7A; } .seal.moles { background: #7A4E86; }
.seal.birds { background: #2C6FB7; } .seal.frogs { background: #1F7A59; } .seal.otters { background: #3A9BC1; color: #15201B; } .seal.vagabond { background: #5B6770; }
.seal.knaves { background: #6B4A2B; } .seal.bats { background: #3B3B7A; } .seal.crows { background: #1F2A33; } .seal.WA { background: #3E7A22; } .seal.lizards { background: #C9A227; color: #15201B; }
.fchip { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; font: 600 15px var(--f-body); border: 1px solid var(--line2); background: var(--card); color: var(--ink); text-decoration: none; cursor: pointer; -webkit-appearance: none; appearance: none; }

.lg a.btn { color: var(--ink); text-decoration: none; }
.lg a.btn.pri, .lg a.btn.discord { color: #fff; }
.lg a.btn.danger { color: var(--clay); }
.lg a.btn.ghost { color: var(--link); }

.lg a.gno, .gcard .gh a.gno { color: var(--ink); text-decoration: none; }
.btn:focus-visible, .ib:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #2B6CB0; outline-offset: 2px; }
.band a:focus-visible, .band button:focus-visible { outline-color: #9CC3F0; }
.input, .sel { min-height: 44px; border: 1px solid var(--line2); border-radius: 8px; background: var(--card); padding: 0 12px; font: 500 15px var(--f-body); color: var(--ink); }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); padding: 12px 16px; border-bottom: 1px solid var(--line2); background: var(--card); }
.tbl td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.lead td { background: var(--forest-wash); }
.gcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.gcard .gf { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--paper); font-size: 13px; color: var(--ink2); }
.phnote { border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.45; color: var(--ink2); background: var(--paper); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 600; color: var(--ink); }

.field textarea { padding: 10px 12px; line-height: 1.5; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.chk, .rad { display: flex; align-items: center; gap: 12px; min-height: 56px; border: 1px solid var(--line2); border-radius: 8px; padding: 0 14px; background: var(--card); cursor: pointer; }
.chk.on, .rad.on { border: 2px solid var(--sel); background: var(--ok-wash); padding: 0 13px; }
.rad { min-height: 48px; gap: 10px; }
.rad.off { opacity: .6; cursor: not-allowed; }
.chk input, .rad input { width: 24px; height: 24px; accent-color: var(--forest); flex: none; margin: 0; }
.ib { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--ink); cursor: pointer; padding: 0; }
.ib[disabled] { opacity: .4; cursor: not-allowed; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
.alert svg { flex: none; margin-top: 2px; }
.alert > div { min-width: 0; overflow-wrap: anywhere; }
.alert.warn { background: var(--warn-wash); color: var(--warn-ink); }
.alert.bad { background: var(--clay-wash); color: var(--clay); }
.alert.ok { background: var(--ok-wash); color: var(--ok); }
.alert.info { background: var(--blue-wash); color: var(--blue); }
.alert a { color: inherit; }
.tag.adm.who2 { margin-left: 4px; }

/* ---- app layout ---- */
.hd-desk { display: none; }
.page { max-width: 1280px; margin: 0 auto; padding: 24px 16px 120px; display: flex; flex-direction: column; gap: 22px; }
.page > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.stack18 { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rowb { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.p16 { padding: 16px; } .p18 { padding: 18px; } .p20 { padding: 20px; }
.h1 { font-size: clamp(48px, 17vw, 72px); } .h1s { font-size: clamp(40px, 13vw, 56px); }
.h2 { font-size: 30px; } .h2b { font-size: 34px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

.hd-phone .bar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 16px; gap: 8px; }
.menu-btn { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--band-line); background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.mlink { display: flex; align-items: center; min-height: 52px; padding: 0 4px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 17px; text-decoration: none; color: var(--ink) !important; }

.dtop { max-width: 1280px; margin: 0 auto; padding: 0 64px; }
.gate { max-width: 440px; margin: 0 auto; padding: 48px 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.sticky-sub { position: fixed; left: 0; right: 0; bottom: 51px; z-index: 30; padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line2); display: flex; gap: 10px; justify-content: center; }
.sticky-sub .btn { flex: 1; max-width: 420px; }
.gtable { display: none; }
.tbl-wrap { overflow-x: auto; }
.lrow { display: grid; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow.lead { background: var(--forest-wash); }
.rk { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; font-size: 18px; border-radius: 6px; }
.rk.top { background: var(--amber); color: #15201B; }
.listhead { padding: 10px 16px; border-bottom: 1px solid var(--line2); display: grid; gap: 8px; }
.pill { display: flex; gap: 8px; flex-wrap: wrap; }
.drop { outline: 2px dashed var(--sel); outline-offset: -4px; }

.faclist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.facadd .fchip .fn { font-size: 14px; }
.md h1 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: .95; font-size: clamp(44px, 12vw, 64px); margin: 0 0 14px; }
.md h2 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 26px 0 10px; }

.md a { overflow-wrap: anywhere; }
.modalbk { position: fixed; inset: 0; background: rgba(8, 14, 11, .6); z-index: 80; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.modalbk[hidden] { display: none; }
.modal { background: var(--card); color: var(--ink); width: 100%; max-width: 520px; border-radius: 14px 14px 0 0; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow: auto; font-family: var(--f-body); }

<body>
<div class="lg" id="lg"><div id="app"></div></div>
<div id="modalbk" class="modalbk" hidden><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="proto" role="region" aria-label="Prototype controls (not part of the product)"></div>
<script>
'use strict';
/* ============================================================
   Data: factions (league/factions.md), seed (season-1/), layouts, league text.
   ============================================================ */
const FACTIONS = [
  { code: 'cats', short: 'CA', name: 'Marquise de Cat', type: 'Militant', reach: 10 },
  { code: 'rats', short: 'LH', name: 'Lord of the Hundreds', type: 'Militant', reach: 9 },
  { code: 'badgers', short: 'KI', name: 'Keepers in Iron', type: 'Militant', reach: 8 },
  { code: 'moles', short: 'UD', name: 'Underground Duchy', type: 'Militant', reach: 8 },
  { code: 'birds', short: 'ED', name: 'Eyrie Dynasties', type: 'Militant', reach: 7 },
  { code: 'frogs', short: 'LD', name: 'Lilypad Diaspora', type: 'Militant', reach: 7 },
  { code: 'otters', short: 'RC', name: 'Riverfolk Company', type: 'Insurgent', reach: 5 },
  { code: 'vagabond', short: 'VB', name: 'Vagabond', type: 'Insurgent', reach: 5 },
  { code: 'knaves', short: 'KD', name: 'Knaves of the Deepwood', type: 'Insurgent', reach: 4 },
  { code: 'bats', short: 'TC', name: 'Twilight Council', type: 'Insurgent', reach: 4 },
  { code: 'crows', short: 'CC', name: 'Corvid Conspiracy', type: 'Insurgent', reach: 3 },
  { code: 'WA', short: 'WA', name: 'Woodland Alliance', type: 'Insurgent', reach: 3 },
  { code: 'lizards', short: 'LC', name: 'Lizard Cult', type: 'Insurgent', reach: 2 }
];

const MD = {"format":"# League Format\n\nHow the league is played. Pairings follow the [pairing rules](pairing-rules.md).\n\n1. **Score is a win.** Other places earn nothing.\n2. **Every table has 4 players.**\n3. **Player count is ideally a multiple of 4.** Each season's roster sets it.\n4. **No Advanced Setup (AdSet).** Each player ranks the factions they want, and the pairings choose from that list.\n5. **Rounds are a grouping, not a time slot.** Games may be listed in rounds, but a round's games need not be played at the same time.\n6. **Two games at once is allowed.** It is a scheduling detail, not something the pairings aim for.\n","rules":"# Pairing Rules\n\nWhat every set of pairings must satisfy, roughly in priority order. The league's [format](format.md) sets the table size and the number of games. Faction codes, types and reach are on [factions](factions.md).\n\n1. **Factions only from the player's own list.** A player only plays factions from their own ranked list. This rule is never broken.\n2. **No repeats, high picks.** A player never repeats a faction, and gets factions as close to the top of their list as possible.\n3. **Even meetings.** Every pair of players meets about the same number of times. No pair sits together every game while other pairs never meet.\n4. **Different seat every game.** Each player sits in a different seat in each of their games. Seat 1 is first in turn order.\n5. **Different map every game.** Each player plays a different map in each of their games.\n6. **Table reach at least 21.** This is the Law of Root's recommended sum for 4 players (5.2.1); see [reach](factions.md#reach).\n7. **Militant and insurgent mix.** Each table has a sensible mix of militant and insurgent factions.\n8. **One of each faction and one board per table.** These limits apply to each table, not to a round. Two games in the same round can use the same faction or the same board.\n","how":"# How Pairing Works\n\nHow the pairing tool decides who plays whom, in which seat, on which map and with which faction. The goal is that you can see why you were placed where you were. The code is in [`league_pairing.py`](../planning/tools/pairing/league_pairing.py) if you want to check it.\n\nThe tool aims at the [pairing rules](pairing-rules.md). Your input is your ranked faction list in [`preferences.json`](../season-1/preferences.json); nothing else about you, such as skill or past results, is used.\n\n## The three steps\n\nThe tool works in three steps, in this order. Each step fixes its part before the next one starts.\n\n1. **Tables and maps.** It deals every player into the right number of games, then keeps swapping players between tables and maps between games, keeping a swap when it makes things more even. It scores a layout on two things: every pair of players meeting about the same number of times, and each player seeing as many different maps as possible. Meetings count far more than maps. It builds several layouts this way and keeps the best few. See [`build_plan`](../planning/tools/pairing/league_pairing.py#L173).\n2. **Factions.** For those few layouts, it starts each player on their top picks, then keeps trying changes: swapping two of a player's factions between their games, or trying another faction from their list. It first avoids anything that breaks a table rule (a faction twice at one table, a faction twice for one player, table reach below 21). Then it ranks results by, in order:\n   - **Worst-off player:** how far the unluckiest player ended up below their own top picks.\n   - **Everyone together:** how far all players ended up below their top picks, added up.\n\n   So the tool would rather give two players their 2nd pick than give one player their 4th. The best result across the layouts wins. See [`assign_factions`](../planning/tools/pairing/league_pairing.py#L267).\n3. **Seats.** Seats are set last, exactly rather than by search, so that nobody sits in the same seat twice. Seat 1 goes first. See [`assign_seats`](../planning/tools/pairing/league_pairing.py#L306).\n\nAt the end, a check confirms every hard rule holds. See [`check`](../planning/tools/pairing/league_pairing.py#L367).\n\n## What it means for you\n\n- **Who you play is random but fair.** Players are mixed so nobody faces the same opponent much more than anyone else. Which particular players you meet comes down to the shuffle.\n- **Your factions come from your list.** Higher on your list means more likely to be played. If you got a lower pick, it is because giving you a higher one would have left someone else worse off, or your table needed more reach.\n- **Your seat is just a rotation.** Seats carry no meaning beyond turn order, and you get a different one each game.\n- **Anyone can rerun it.** The tool uses a numbered seed for its random choices. The same faction lists and seed give the same pairings, so the published pairings can be checked.\n\n## Known gaps\n\nThe tool was built before the current rules and is still being brought in line. Until these are fixed, it does not fully meet the [pairing rules](pairing-rules.md):\n\n- **Off-list factions.** If it cannot fit everyone from their own lists, it can fall back to a faction outside a player's list, as a last resort. The rules forbid this.\n- **Militant and insurgent mix.** It does not check the mix at each table yet.\n- **Games each.** It defaults to 4 games each; the number for this season is not set yet.\n\nThe 12-player samples in planning were laid out by hand from a fixed pattern, not by this tool.\n"};

/* ---------- seeded random ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- table rules ---------- */
function tableIssues(codes) {
  const out = [], set = new Set(codes);
  if (set.size < codes.length) out.push('a faction appears twice');
  const reach = codes.reduce((s, c) => s + FA[c].reach, 0);
  if (reach < MIN_REACH) out.push('reach is ' + reach + ', needs at least ' + MIN_REACH);
  const mil = codes.filter(c => FA[c].type === 'Militant').length;
  if (mil === 0) out.push('no militant faction');
  if (mil === codes.length) out.push('no insurgent faction');
  if (set.has('vagabond') && set.has('knaves')) out.push('Vagabond and Knaves together');
  return out;
}
const tableReach = codes => codes.reduce((s, c) => s + FA[c].reach, 0);
const tableMix = codes => { const m = codes.filter(c => FA[c].type === 'Militant').length; return m + ' militant, ' + (codes.length - m) + ' insurgent'; };
function tableCost(codes) {
  const reach = tableReach(codes);
  return tableIssues(codes).length * 100 + (reach < MIN_REACH ? (MIN_REACH - reach) * 5 : 0);
}

/* Faction step on a fixed layout. tables: arrays of player indices in seat order. */
function assignFactions(tables, players, g, rng) {
  const fac = tables.map(() => [null, null, null, null]);
  const cells = players.map(() => []);
  tables.forEach((tab, t) => tab.forEach((p, s) => cells[p].push([t, s])));
  players.forEach((pl, p) => {
    const picks = shuffle(pl.list.slice(0, g), rng);
    cells[p].forEach((c, k) => { fac[c[0]][c[1]] = picks[k % picks.length]; });
  });
  const rankOf = (p, code) => players[p].list.indexOf(code);
  const tc = t => tableCost(fac[t]);
  const iters = 20000;
  for (let it = 0; it < iters; it++) {
    const T = 25 * Math.pow(0.2 / 25, it / iters);
    const p = Math.floor(rng() * players.length), cs = cells[p];
    if (rng() < 0.6 || players[p].list.length <= g) {
      if (cs.length < 2) continue;
      const a = Math.floor(rng() * cs.length); let b = Math.floor(rng() * cs.length); if (a === b) continue;
      const [t1, s1] = cs[a], [t2, s2] = cs[b];
      const before = tc(t1) + (t2 !== t1 ? tc(t2) : 0);
      const x = fac[t1][s1]; fac[t1][s1] = fac[t2][s2]; fac[t2][s2] = x;
      const d = tc(t1) + (t2 !== t1 ? tc(t2) : 0) - before;
      if (d > 0 && rng() > Math.exp(-d / T)) { const y = fac[t1][s1]; fac[t1][s1] = fac[t2][s2]; fac[t2][s2] = y; }
    } else {
      const [t, s] = cs[Math.floor(rng() * cs.length)];
      const used = new Set(cs.map(c => fac[c[0]][c[1]]));
      const free = players[p].list.filter(c => !used.has(c));
      if (!free.length) continue;
      const nf = free[Math.floor(rng() * free.length)], old = fac[t][s];
      const before = tc(t) + rankOf(p, old);
      fac[t][s] = nf;
      const d = tc(t) + rankOf(p, nf) - before;
      if (d > 0 && rng() > Math.exp(-d / T)) fac[t][s] = old;
    }
  }
  return fac;
}

function layoutSpread(lay, N, g) {
  const meet = Array.from({ length: N }, () => new Array(N).fill(0));
  let seatRepeat = 0;
  lay.tables.forEach(t => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if (i !== j) meet[t.s[i] - 1][t.s[j] - 1]++; });
  for (let p = 1; p <= N; p++) {
    const seats = []; lay.tables.forEach(t => { const k = t.s.indexOf(p); if (k >= 0) seats.push(k); });
    seatRepeat += seats.length - new Set(seats).size;
  }
  const dist = {};
  let repeatMax = 0;
  for (let p = 0; p < N; p++) {
    const d = {}; let extra = 0;
    for (let q = 0; q < N; q++) if (q !== p) { const k = meet[p][q]; d[k] = (d[k] || 0) + 1; if (k > 1) extra += k - 1; }
    Object.keys(d).forEach(k => { (dist[k] = dist[k] || []).push(d[k]); });
    repeatMax = Math.max(repeatMax, extra);
  }
  const rows = Object.keys(dist).map(k => ({ k: +k, min: Math.min.apply(null, dist[k]), max: Math.max.apply(null, dist[k]) })).sort((a, b) => a.k - b.k);
  const maps = {}; lay.tables.forEach(t => { maps[t.m] = (maps[t.m] || 0) + 1; });
  const sameForAll = rows.every(r => r.min === r.max);
  return { rows, even: repeatMax <= 1 && sameForAll, seatRepeat, games: lay.tables.length, maps, N, g, repeatMax };
}

let run = null; // {seed, pass, total, best, cancelled, timer}
function startRun(seed, onTick, onDone) {
  const se = SE();
  const order = shuffle(se.league, mulberry32(seed * 2654435761 >>> 0));
  const lay = layoutFor(se.cap, se.each);
  const players = order.map(pid => ({ id: pid, name: pname(pid), list: listOf(pid).codes.slice() }));
  const tables = lay.tables.map(t => t.s.map(x => x - 1));
  const blocking = [];
  players.forEach((p, i) => {
    const n = tables.filter(t => t.includes(i)).length;
    if (p.list.length < n) blocking.push({ rule: 'Own list only', who: p.name + ' has ' + p.list.length + ' faction' + (p.list.length === 1 ? '' : 's') + ' and sits at ' + n + ' tables. A faction cannot repeat, so nothing on their list is left for table ' + (lay.tables.findIndex(t => t.s.includes(i + 1)) + 1) + '.' });
  });
  run = { seed, pass: 0, total: 10, best: null, cancelled: false };
  const r = run;
  const step = () => {
    if (r.cancelled) return;
    if (blocking.length || r.pass >= r.total) {
      run = null;
      if (blocking.length) return onDone({ ok: false, seed, blocking });
      return onDone(finishDraft(seed, order, lay, players, tables, r.best));
    }
    const rng = mulberry32((seed * 1000003 + r.pass * 7919) >>> 0);
    const fac = assignFactions(tables, players, se.each, rng);
    const viol = fac.reduce((s, row) => s + tableIssues(row).length, 0);
    const rankSum = fac.reduce((s, row, t) => s + row.reduce((a, c, k) => a + players[tables[t][k]].list.indexOf(c), 0), 0);
    const score = viol * 1000 + rankSum;
    if (!r.best || score < r.best.score) r.best = { score, fac };
    r.pass++;
    onTick(Math.round(r.pass / r.total * 100));
    r.timer = setTimeout(step, 110);
  };
  r.timer = setTimeout(step, 60);
}

  const bad = [];
  games.forEach(g => {
    const iss = tableIssues(g.seats.map(s => s.f));
    if (iss.length) {
      const codes = g.seats.map(s => s.f);
      bad.push({ rule: iss[0].indexOf('reach') === 0 ? 'Table reach at least ' + MIN_REACH : iss[0].indexOf('Vagabond') === 0 || iss[0].indexOf('no ') === 0 ? 'Militant and insurgent mix' : 'One of each faction per table',

    }

    const mine = []; games.forEach(g => g.seats.forEach(s => { if (s.pid === pid) mine.push({ no: g.no, rank: players[i].list.indexOf(s.f) + 1 }); }));
    return { pid, name: pname(pid), ranks: mine.map(x => x.rank) };

}

    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;

    else cell += c;
  }

}

  return { upcoming: tag('', 'Upcoming'), recorded: tag('solid', 'Recorded'), settled: tag('solid', 'Recorded'), disputed: tag('warn', 'Disputed'), void: tag('bad', 'Void') }[s];
}
function resultText(g) {
  const s = gstate(g);
  if (s === 'void') return 'Void: not counted';
  if (s === 'disputed') return 'Disputed, the admin will decide';
  if (s === 'upcoming') return 'No result yet';
  return 'Won by ' + winnersOf(g).map(pname).join(', ');
}
function gameCard(g, m) {
  return '<article class="gcard"><div class="gh"><a class="gno" href="#/game/' + g.no + '">Table ' + g.no + ' <span class="muted">' + esc(mapName(g)) + '</span></a>' + statusTag(g) + '</div>' +
    g.seats.map(s => '<div class="seat' + (winnersOf(g).includes(s.pid) ? ' win' : '') + '"><span class="num">' + s.seat + '</span>' + nameCell(g, s, m) + fchip(s.f) + '</div>').join('') +
    '<div class="gf">' + esc(resultText(g)) + '</div></article>';
}
function gameTable(games, m) {
  return '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Table</th><th>Map</th><th>Seat 1</th><th>Seat 2</th><th>Seat 3</th><th>Seat 4</th><th>Result</th></tr></thead><tbody>' +
    games.map(g => '<tr><td><a class="num" style="font-size:24px;text-decoration:none;color:var(--ink)" href="#/game/' + g.no + '">' + g.no + '</a></td><td>' + esc(mapName(g)) + '</td>' +
      g.seats.map(s => '<td><div class="stack8"><span class="num">' + s.seat + ' ' + nameCell(g, s, m) + '</span>' + fchip(s.f) + '<span>' + typeTag(s.f) + '</span></div></td>').join('') +
      '<td>' + statusTag(g) + '<div class="muted" style="margin-top:6px;font-size:13px">' + esc(resultText(g)) + '</div></td></tr>').join('') + '</tbody></table></div>';
}

const ADMIN_NAV = [['admin', 'Dashboard'], ['admin/whitelist', 'Whitelist'], ['admin/roster', 'Roster'], ['admin/season', 'Season'], ['admin/start', 'Start season'], ['admin/disputes', 'Disputes'], ['admin/fixit', 'Fix it'], ['admin/csv', 'CSV']];
const onNav = (r, p) => p === '' ? r.parts.length === 0 : p === 'admin' ? r.parts.join('/') === 'admin' : r.parts.join('/').indexOf(p) === 0 || (p === 'pairings' && r.parts[0] === 'game');

    '<div style="display:flex;align-items:center;gap:12px;padding-bottom:12px"><span class="who">' + esc(SE().name) + ', ' + stage() + '</span><span class="who">Signed in as <b style="color:#fff">' + esc(m.name) + '</b></span>' + (m.admin ? '<span class="tag adm">Admin</span>' : '') + '<button type="button" class="btn sm" data-act="signout" style="background:transparent;color:#fff;border-color:var(--band-line)">Sign out</button></div></div></div>' +
    (m.admin ? '<div class="band adm" style="background:#1D4B38;color:#fff"><div class="dtop" style="display:flex;align-items:center;gap:28px;flex-wrap:wrap"><span class="kicker" style="color:#D5E3DA">Admin</span><nav aria-label="Admin" style="display:flex;gap:26px;flex-wrap:wrap">' +

function seasonHead() {

/* ---------- home ---------- */
function pHome(m) {
  const se = SE(), st = stage();
  if (m.player) {

      '<div class="cols-main"><section class="stack" id="standings"><h2 class="disp h2b">Standings</h2>' + standingsCard(m) + '</section>' +
      '<section class="stack"><div class="rowb"><h2 class="disp h2b">Pick\'em leaderboard</h2><a href="#/pickems">View all</a></div>' + boardCard(m, 5) + '</section></div></main>';
  }
  if (m.onRoster && st !== 'live') return pProspectHome(m);
  let box;
  if (st === 'open') box = '<div class="card p18" style="border:2px solid var(--forest)"><div class="stack"><h2 class="disp h2b">Join ' + esc(se.name) + '</h2><button type="button" class="btn pri" data-act="join" style="min-height:52px;font-size:16px">' + ic('plus') + 'Join league</button></div></div>';
  else if (st === 'locked') box = '<div class="card p18"><div class="stack"><h2 class="disp h2b">Joining is closed</h2><p>Lists are locked. The season has not started yet.</p></div></div>';
  else box = '<div class="card p18" style="border:2px solid var(--forest)"><div class="stack"><h2 class="disp h2b">Season in progress</h2><p style="font-size:15px">Joining is closed. Follow the games and make your picks.</p><div class="row"><a class="btn pri" href="#/pickems">' + ic('arrow') + 'Pick\'ems</a><button type="button" class="btn" data-act="scroll" data-a="standings">Standings</button></div></div></div>';
  return '<main class="page" id="main">' + seasonHead() + box +
    (st === 'live' ? '<div class="cols-main"><section class="stack" id="standings"><h2 class="disp h2b">Standings</h2>' + standingsCard(m) + '</section><section class="stack"><div class="rowb"><h2 class="disp h2b">Pick\'em leaderboard</h2><a href="#/pickems">View all</a></div>' + boardCard(m, 5) + '</section></div>' : '') + '</main>';

function pProspectHome(m) {
  const se = SE(), st = stage(), l = listOf(m.pid), ok = l.codes.length >= se.minList;

  const listCard = submitted
    ? '<div class="card p16"><div class="stack"><h2 class="disp h2">Your faction list</h2><div class="row">' + tag('ok', 'Submitted', 'check') + '<span class="muted">' + plural(l.codes.length, 'faction') + '</span></div>' + seals + '<a class="btn" href="#/my-list">' + (st === 'open' ? 'Edit my list' : 'View my list') + '</a></div></div>'
    : '<div class="card p16" style="border:2px solid #E3B15A"><div class="stack"><h2 class="disp h2">Your faction list</h2>' + alert('warn', '<b>Not submitted yet.</b> ' + (st === 'open' ? 'Rank your factions before lists lock.' : 'Lists are locked. Ask the admin.')) + (l.codes.length ? seals : '') +
      (st === 'open' ? '<a class="btn pri" href="#/my-list" style="min-height:52px">' + ic('arrow') + (l.codes.length ? 'Review and submit' : 'Rank my factions') + '</a>' : '') + '</div></div>';
  const cd = st === 'open' ? '<div class="card p16" style="display:flex;align-items:center;gap:16px;background:var(--warn-wash);border-color:transparent;flex-wrap:wrap"><div style="display:flex;flex-direction:column"><span class="num" style="font-size:40px;line-height:1;color:var(--warn-ink)" data-cd="' + se.lockAt + '">' + fmtCd(se.lockAt - now()) + '</span><span style="font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--warn-ink)">until lists lock</span></div><p style="font-size:14px;color:var(--warn-ink)">' + esc(fmtDT(se.lockAt)) + '</p></div>'
    : alert('info', 'Lists are locked. ' + esc(fmtDT(se.lockAt)) + '. The season has not started yet.', 'lock');
  return '<main class="page" id="main">' + seasonHead() + cd + '<div class="cols2" style="align-items:start">' + listCard +
    '<div class="card p16"><div class="stack"><h2 class="disp h2">Pairings</h2><p class="muted">Not published yet.</p><a class="btn" href="#/pairings">See the layout</a></div></div></div>' +
    (st !== 'live' ? '<div><button type="button" class="btn danger ghost" data-act="leave" style="padding:0">Leave league</button></div>' : '') + '</main>';

/* ---------- my list ---------- */
function canEditList(m) { return m.onRoster && !SE().started && (stage() === 'open' || m.admin); }
function initDraft(m) {
  const l = listOf(m.pid);
  if (!U.draft || U.draft.pid !== m.pid) U.draft = { pid: m.pid, codes: l.codes.slice() };
}
function pMyList(m) {
  if (!m.onRoster) return '<main class="page" id="main"><h1 class="disp h1s">My list</h1>' + alert('info', 'Join the league to rank factions. <a href="#/">Back to Home</a>') + '</main>';
  const se = SE(), editable = canEditList(m);
  initDraft(m);
  const codes = editable ? U.draft.codes : listOf(m.pid).codes;
  const link = '<a href="' + DB_URL + '" target="_blank" rel="noopener">Root Database</a> <a href="' + LAW_URL + '" target="_blank" rel="noopener">Law of Root</a>';
  const items = codes.map((c, i) => '<div class="card p16 stack" style="gap:10px"><div class="row" style="flex-wrap:nowrap;gap:12px"><span class="num" style="font-size:30px;width:28px">' + (i + 1) + '</span><span class="fchip" style="flex:1">' + seal(c) + '<span class="fn">' + esc(FA[c].name) + '</span></span>' +
    (editable ? '<button type="button" class="ib" data-act="l-up" data-a="' + i + '" aria-label="Move ' + esc(FA[c].name) + ' up"' + (i === 0 ? ' disabled' : '') + '>' + ic('up') + '</button><button type="button" class="ib" data-act="l-down" data-a="' + i + '" aria-label="Move ' + esc(FA[c].name) + ' down"' + (i === codes.length - 1 ? ' disabled' : '') + '>' + ic('down') + '</button>' : '') + '</div>' +
    '<div class="row" style="gap:12px">' + fmeta(c) + '<span class="row" style="gap:12px;font-size:14px">' + link + '</span>' + (editable ? '<button type="button" class="btn sm ghost danger" data-act="l-remove" data-a="' + i + '">Remove</button>' : '') + '</div></div>').join('');
  const need = Math.max(se.minList, se.each), n = codes.length, can = n >= need;
  if (!editable) {
    return '<main class="page" id="main"><div class="rowb"><h1 class="disp h1s">My list</h1>' + tag('', 'Locked', 'lock') + '</div>' +
      alert('info', (se.started ? 'The season has started. ' : 'Lists locked on ' + esc(fmtDT(se.lockAt)) + '. ') + 'Ask the admin if something needs changing.', 'lock') +
      '<div class="stack" style="max-width:720px">' + items + '</div></main>';
  }
  const fresh = S.ui.joined === m.pid && !listOf(m.pid).codes.length && !codes.length;
  const submit = (id) => '<button type="button" class="btn pri" data-act="l-submit"' + (can ? '' : ' disabled') + ' style="min-height:52px">' + 'Submit list</button>';
  const addable = se.pool.filter(c => !codes.includes(c));
  return '<main class="page" id="main">' + (S.ui.joined === m.pid ? alert('ok', '<b>You\'re on the list!</b>', 'check') : '') +
    '<div class="stack8"><h1 class="disp h1s">' + (S.ui.joined === m.pid && !listOf(m.pid).codes.length ? 'Rank your factions' : 'My list') + '</h1>' +
    '<span class="muted">' + lockLine() + '</span>' +
    '<p class="muted">Best first. Pick at least ' + need + '.' + (can ? '' : ' ' + (need - n) + ' to go.') + '</p></div>' +
    '<div class="only-desk">' + submit() + '</div>' +
    (codes.length ? '<div class="stack" style="max-width:720px">' + items + '</div>' : '<div class="card p16"><span class="muted">Nothing ranked yet. Tap Add on a faction below.</span></div>') +
    (addable.length ? '<h2 class="disp h2b">Add a faction</h2><div class="faclist">' + addable.map(c => '<div class="card facadd"><span class="fchip">' + seal(c) + '<span class="fn">' + esc(FA[c].name) + '</span></span><span class="reach">' + FA[c].type + ', reach ' + FA[c].reach + '</span><div class="row" style="gap:10px"><a href="' + DB_URL + '" target="_blank" rel="noopener" style="font-size:13px">Root DB</a><button type="button" class="btn sm" data-act="l-add" data-a="' + c + '" style="margin-left:auto">Add</button></div></div>').join('') + '</div>' : '') +
    '<div class="row"><button type="button" class="btn" data-act="l-discard">Discard</button></div>' +
    '<div class="sticky-sub only-mobile">' + submit() + '</div></main>';
}

      return '<div class="lrow" style="grid-template-columns:minmax(0,1fr) auto"><span>' + esc(pname(p)) + (p === m.pid ? ' ' + youTag : '') + '</span>' + (done ? tag('ok', 'List in', 'check') : '<span class="muted">Waiting</span>') + '</div>'; }).join('') + '</div></main>';

/* ---------- pairings ---------- */
function filtered(f, m) {
  const g = SE().games;
  if (f === 'mine') return g.filter(x => m.pid && seatOf(x, m.pid));
  if (f === 'completed') return g.filter(counted);
  if (f === 'upcoming') return g.filter(x => !counted(x) && !x.void);
  return g;
}
function pPairings(m) {
  const se = SE();
  if (!se.started) {
    const lay = layoutFor(se.cap, se.each);
    const cards = lay ? lay.tables.map((t, i) => '<article class="gcard"><div class="gh"><span class="gno">Table ' + (i + 1) + ' <span class="muted">' + esc(se.maps[t.m % se.maps.length]) + '</span></span>' + tag('', 'Not started') + '</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">' +
      t.s.map((slot, k) => '<div style="padding:12px 18px"><div class="sno gcard-sno" style="font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)">Seat ' + (k + 1) + '</div><div class="num" style="font-size:26px">P' + slot + '</div></div>').join('') + '</div></article>').join('') : '';
    return '<main class="page" id="main"><div class="stack8"><div class="kicker">' + esc(se.name) + '</div><h1 class="disp h1s">Pairings</h1></div>' +
      alert('info', '<b>Not started.</b> Names and factions show up when the season starts. Lists lock ' + esc(fmtDT(se.lockAt)) + '.') +
      '<div class="muted" style="font-size:14px">Layout for ' + se.cap + ' players, ' + se.each + ' games each. Player numbers are dealt at random when the admin starts the season.</div>' +
      '<div class="cols2" style="align-items:start">' + cards + '</div></main>';
  }
  const f = U.pf || 'all', list = filtered(f, m);
  const tabs = [['mine', 'Mine'], ['all', 'All'], ['completed', 'Completed'], ['upcoming', 'Upcoming']].filter(t => t[0] !== 'mine' || m.pid && se.games.some(g => seatOf(g, m.pid)));
  return '<main class="page" id="main"><div class="stack8"><div class="kicker">' + esc(se.name) + '</div><h1 class="disp h1s">Pairings</h1></div>' +
    '<div class="pill" role="group" aria-label="Filter games">' + tabs.map(t => '<button type="button" class="btn sm' + (f === t[0] ? ' pri' : '') + '" data-act="pf" data-a="' + t[0] + '" aria-pressed="' + (f === t[0]) + '">' + t[1] + ' <span class="num">' + filtered(t[0], m).length + '</span></button>').join('') + '</div>' +
    (list.length ? '<div class="gcards cols2" style="align-items:start">' + list.map(g => gameCard(g, m)).join('') + '</div><div class="gtable">' + gameTable(list, m) + '</div>' : '<div class="card p16 muted">No games here.</div>') + '</main>';
}

/* ---------- a game ---------- */

/* ---------- league info: rendered from the repo text ---------- */
function mdLink(u) {
  const m = u.match(/^([^#]*)(#.*)?$/), file = m[1], anchor = m[2] || '';
  if (/^https?:/.test(u)) return [u, true];
  if (file === 'format.md') return ['#/info/format', false];
  if (file === 'pairing-rules.md') return ['#/info/rules', false];
  if (file === 'how-pairing-works.md') return ['#/info/how', false];
  const norm = file.replace(/^\.\.\//, '');
  return [REPO + (file.indexOf('../') === 0 ? norm : 'league/' + file) + anchor, true];
}
function mdInline(s) {
  return esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g, (x, t, u) => { const l = mdLink(u); return '<a href="' + l[0] + '"' + (l[1] ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>'; })
    .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function mdBlocks(lines) {
  let out = '', i = 0;
  const mk = /^(\d+\.|-)\s+/;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,2})\s+(.*)/))) { out += '<h' + m[1].length + '>' + mdInline(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
    if (mk.test(l)) {
      const ord = /^\d/.test(l), items = [];
      while (i < lines.length && (mk.test(lines[i]) && !/^\s/.test(lines[i]) || /^\s+\S/.test(lines[i]) || (!lines[i].trim() && i + 1 < lines.length && /^\s+\S/.test(lines[i + 1])))) {
        if (mk.test(lines[i]) && !/^\s/.test(lines[i])) items.push([lines[i].replace(mk, '')]);
        else if (lines[i].trim()) items[items.length - 1].push(lines[i].replace(/^ {1,3}/, ''));
        i++;
      }
      out += '<' + (ord ? 'ol' : 'ul') + '>' + items.map(it => { const k = it.findIndex((x, ix) => ix > 0 && mk.test(x)); const text = (k < 0 ? it : it.slice(0, k)).join(' '); return '<li>' + mdInline(text) + (k < 0 ? '' : mdBlocks(it.slice(k))) + '</li>'; }).join('') + '</' + (ord ? 'ol' : 'ul') + '>';
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^#{1,2}\s/.test(lines[i]) && !mk.test(lines[i])) para.push(lines[i++]);
    out += '<p>' + mdInline(para.join(' ')) + '</p>';
  }
  return out;
}

/* ---------- fix it ---------- */
const FIX_AREAS = [['people', 'People and roles'], ['roster', 'Roster and lists'], ['season', 'Season settings and dates'], ['games', 'Games, seats and factions'], ['results', 'Submissions and results'], ['picks', 'Pick\'ems']];
function seatIssues(g, seats) {
  const out = [], codes = seats.map(s => s.f);
  seats.forEach(s => { const l = listOf(s.pid).codes; if (s.pid && !l.includes(s.f)) out.push('Rule 1, own list only: ' + FA[s.f].name + ' is not on ' + pname(s.pid) + '\'s list.'); });
  if (new Set(codes).size < codes.length) out.push('Rule 8, one of each faction per table: a faction appears twice at this table.');
  if (new Set(seats.map(s => s.pid)).size < seats.length) out.push('Four different players at every table: a player is seated twice.');
  const reach = tableReach(codes); if (reach < MIN_REACH) out.push('Rule 6, table reach at least ' + MIN_REACH + ': this table is now ' + reach + '.');
  const mil = codes.filter(c => FA[c].type === 'Militant').length;
  if (mil === 0 || mil === 4) out.push('Rule 7, militant and insurgent mix: this table has no ' + (mil === 0 ? 'militant' : 'insurgent') + ' faction.');
  if (codes.includes('vagabond') && codes.includes('knaves')) out.push('Rule 7, never Vagabond with Knaves: both are at this table.');
  SE().games.forEach(o => { if (o.no === g.no) return; seats.forEach(s => { const os = seatOf(o, s.pid); if (os && os.f === s.f) out.push('Rule 2, no repeats: ' + pname(s.pid) + ' also plays ' + FA[s.f].name + ' at table ' + o.no + '.'); }); });
  return out;
}
function fixNav() { return '<nav class="stack8" aria-label="Fix it areas"><div class="kicker">Area</div>' + FIX_AREAS.map(a => '<a href="#/admin/fixit?a=' + a[0] + '" style="padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:' + (U.fixArea === a[0] ? 700 : 500) + ';color:var(--ink)">' + a[1] + '</a>').join('') + '</nav>'; }

/* ============================================================
   Views, part C: router, prototype bar, actions, boot.
   ============================================================ */
function pageFor(r, m) {
  if (m.state === 'visitor') return r.parts[0] === 'discord' ? pConsent() : pLanding();
  if (m.state === 'notinvited') return pNotInvited(m);
  const p = r.parts[0] || '';
  if (p === 'admin') {
    if (!m.admin) return needAdmin();
    switch (r.parts[1] || '') {
      case '': return pAdminDash(); case 'whitelist': return pWhitelist(); case 'roster': return pRoster(); case 'season': return pSeason();
      case 'start': return pStart(); case 'disputes': return pDisputes(r); case 'fixit': return pFixit(r); case 'csv': return pCsv();
    }
    return pAdminDash();
  }
  switch (p) {
    case 'players': return pPlayers(m);
    case 'pairings': return pPairings(m);
    case 'game': return pGame(m, r.parts[1]);
    case 'pickems': return pPickems(m);
    case 'my-list': return pMyList(m);
    case 'info': return pInfo(r);
  }
  return pHome(m);
}
function render() {
  const r = route(), m = me();
  if (r.key !== U.lastKey) {
    if (U.lastKey === 'my-list') S.ui.joined = null;
    if (r.parts[0] !== 'my-list') U.draft = null;
    if (!/^admin\/(season|fixit)/.test(r.key)) U.sd = null;
    if (r.parts[0] !== 'game') U.editing = null;
    if (r.key !== 'admin/csv') U.csvPlan = null;
    if (r.key !== 'admin/fixit') { U.fxSeats = null; U.fxList = null; }
    U.rosterErr = null; U.wlErr = null; U.pasteErrs = null; U.sdMsg = null; U.menu = false;
    U.lastKey = r.key; window.scrollTo(0, 0);
  }
  const pg = pageFor(r, m);
  const body = (U.menu && m.state === 'in') ? menuPanel(r, m) + '<div class="only-desk">' + pg + '</div>' : pg;
  const keep = document.activeElement && document.activeElement.id;
  $('#app').innerHTML = '<a class="sr" href="#main">Skip to content</a>' + headerHTML(r, m) + body;
  if (keep && $('#' + keep) && /^(wl-|np|sd-|seed|fx-|lk-)/.test(keep) && U.keepFocus) { const e = $('#' + keep); e.focus(); }
  U.stage = stage();
  renderBar();
  document.documentElement.dataset.theme = S.theme && S.theme !== 'auto' ? S.theme : '';
  if (!S.theme || S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
}

ACT['l-discard'] = () => { U.draft = null; toast('Changes discarded.'); render(); };
ACT['l-submit'] = () => {

/* pairings and games */
ACT.pf = el => { U.pf = el.dataset.a; render(); };
ACT['edit-result'] = el => { U.editing = Number(el.dataset.a); render(); };
ACT['edit-cancel'] = () => { U.editing = null; render(); };
ACT['submit-result'] = el => { const w = Array.from(document.querySelectorAll('input[name=win]:checked')).map(i => i.value); const r = submitResult(el.dataset.a, w); if (r.ok) U.editing = null; res(r); };
ACT['save-pick'] = el => { const n = el.dataset.a; const r = savePick(n, fv('p1-' + n, null) || (SE().picks.find(p => p.acct === me().acct && p.game === +n) || {}).first, fv('p2-' + n, null) !== null ? fv('p2-' + n) : (SE().picks.find(p => p.acct === me().acct && p.game === +n) || {}).second); res(r); };
/* whitelist */
ACT['wl-add'] = () => { const r = addWl(fv('wl-id'), fv('wl-label')); if (r.ok) { U.f['wl-id'] = ''; U.f['wl-label'] = ''; U.wlErr = null; toast('Added to the whitelist.'); } else U.wlErr = r.msg; render(); };
ACT['wl-check'] = () => { U.pasteErrs = parseWlPaste(fv('wl-paste')); render(); };
ACT['wl-paste-add'] = () => {
  const pr = parseWlPaste(fv('wl-paste'));
  pr.rows.forEach(r => addWl(r.id, r.label));
  const bad = fv('wl-paste').split('\n').filter(l => l.trim() && !pr.rows.some(r => l.trim().indexOf(r.id) === 0));

ACT['wl-admin'] = el => {

};
ACT['wl-label'] = el => { const w = wlOf(el.dataset.a); ask({ title: 'Edit label', input: { label: 'Name label', value: w.label }, ok: 'Save', cb: v => { logit('Whitelist', 'Label for ' + w.id, w.label, v); w.label = v.trim(); save(); } }); };
ACT['wl-remove'] = el => { const w = wlOf(el.dataset.a); ask({ title: 'Remove from the whitelist?', body: '<p>' + esc(w.label || w.id) + ' loses access at once, even in an open session. Their roster entry and list stay.</p>', ok: 'Remove', danger: true, cb: () => { if (w.admin && S.wl.filter(x => x.admin).length < 2) return toast('There must be at least one admin.', true); removeWl(w.id); toast('Removed.'); } }); };
/* roster */
ACT['r-move'] = el => { const pid = el.dataset.a, to = onList(pid) === 'league' ? 'wait' : 'league'; const r = rosterMove(pid, to); U.rosterErr = r.ok ? null : { msg: r.msg, swapFor: to === 'league' ? pid : null }; render(); };
function reorder(pid, d) { const a = SE().wait, i = a.indexOf(pid), j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; logit('Roster', pname(pid) + ' moved ' + (d < 0 ? 'up' : 'down') + ' the waitlist', i + 1, j + 1); save(); render(); }
ACT['r-up'] = el => reorder(el.dataset.a, -1);
ACT['r-down'] = el => reorder(el.dataset.a, 1);
ACT['r-remove'] = el => { const pid = el.dataset.a, n = SE().picks.filter(p => p.first === pid || p.second === pid).length; ask({ title: 'Remove ' + pname(pid) + '?', body: '<p>' + (listOf(pid).codes.length ? 'Their ranked list of ' + plural(listOf(pid).codes.length, 'faction') + ' is cleared. ' : '') + (n ? plural(n, 'pick\'em pick') + ' naming them are deleted.' : 'They have no picks.') + '</p>', ok: 'Remove', danger: true, cb: () => { res(removeFromRoster(pid)); } }); };
ACT['r-add'] = () => { const r = addPerson(fv('np')); if (r.ok) U.f.np = ''; res(r); };
ACT['r-swap'] = el => { const r = rosterSwap(el.dataset.a, val('swap-sel')); U.rosterErr = r.ok ? null : { msg: r.msg }; render(); if (r.ok) toast('Swapped.'); };
let dragPid = null;
function dropOn(t) {
  const row = t.closest('[data-drop="row"]'), col = t.closest('[data-drop="col"]');
  if (!dragPid || !(row || col)) return;
  const list = (row || col).dataset.list, from = onList(dragPid), se = SE();
  let r;
  if (row) {
    const tp = row.dataset.pid; if (tp === dragPid) return;
    if (from !== list && list === 'league' && se.league.length >= se.cap) r = rosterSwap(dragPid, tp); else r = rosterMove(dragPid, list, tp);
  } else r = rosterMove(dragPid, list);
  U.rosterErr = r.ok ? null : { msg: r.msg, swapFor: list === 'league' && from !== 'league' ? dragPid : null };
  dragPid = null; render();
}
/* season */
const sdFix = () => { const d = U.sd; if (!(VALID[d.cap] || []).includes(d.games)) d.games = (VALID[d.cap] || [4]).includes(4) ? 4 : VALID[d.cap][0]; };
ACT['sd-cap'] = el => { U.sd.cap = +el.dataset.a; sdFix(); U.sd.ack = null; render(); };
ACT['sd-games'] = el => { U.sd.games = +el.dataset.a; U.sd.ack = null; render(); };
ACT['sd-pool'] = el => { const p = U.sd.pool, c = el.dataset.a, i = p.indexOf(c); if (i >= 0) p.splice(i, 1); else p.push(c); render(); };
ACT['sd-map-add'] = () => { const v = val('sd-newmap').trim(); if (!v) return toast('Type a map name.', true); if (U.sd.maps.includes(v)) return toast('That map is already there.', true); U.sd.maps.push(v); render(); };
ACT['sd-map-del'] = el => { U.sd.maps.splice(+el.dataset.a, 1); render(); };
ACT['sd-ack'] = () => { U.sd.ack = U.sd.cap + '-' + U.sd.games; render(); };
const sdFields = () => { const d = U.sd; return { name: d.name, cap: +d.cap, games: +d.games, maps: d.maps.slice(), pool: ACTIVE_ORDER(d.pool), minList: +d.minList, lockAt: new Date(d.date + 'T' + d.time).getTime() }; };
const ACTIVE_ORDER = pool => ALL_CODES.filter(c => pool.includes(c));
ACT['sd-save'] = () => { const r = saveSeason(sdFields()); U.sdMsg = r; if (r.ok) { U.sd = null; toast(r.msg); } render(); };
ACT['fx-season-save'] = () => {
  const f = sdFields(), se = SE();
  [['name', 'name', 'name'], ['cap', 'cap', 'capacity'], ['each', 'games', 'games each'], ['minList', 'minList', 'minimum list length'], ['lockAt', 'lockAt', 'lock date']].forEach(([k, fk, l]) => { if (se[k] !== f[fk]) { logit('Season', l, k === 'lockAt' ? fmtDT(se[k]) : se[k], k === 'lockAt' ? fmtDT(f[fk]) : f[fk]); se[k] = f[fk]; } });
  save(); U.sd = null; toast('Season settings saved.'); render();
};
/* start season */
function launch(seed) {
  cancelRun(); U.fail = null; U.pct = 0; SE().draft = null; SE().seed = seed; save();
  startRun(seed, p => { U.pct = p; if (/admin\/start/.test(location.hash)) render(); }, r => {
    if (r.ok) { SE().draft = r.draft; U.fail = null; } else U.fail = r;
    save(); if (/admin\/start/.test(location.hash)) render();
  });
  render();
}
ACT.run = () => { const s = parseInt(fv('seed', SE().seed), 10); if (!s) return toast('Enter a numeric seed.', true); launch(s); };
ACT.reroll = () => { const s = 10000 + Math.floor(Math.random() * 89999); U.f.seed = String(s); launch(s); };
ACT['run-cancel'] = () => { cancelRun(); U.pct = 0; toast('Run cancelled.'); render(); };
ACT.publish = () => { const r = publishDraft(); if (r.ok) { toast('Pairings published. Joining is closed and pick\'ems are open.'); location.hash = '#/pairings'; } else res(r); };
ACT['discard-draft'] = () => { SE().draft = null; save(); render(); };
/* disputes */
ACT['d-choice'] = el => { U.f['dchoice-' + el.dataset.a] = el.value; render(); };
ACT['d-win'] = el => { const k = 'dw-' + el.dataset.a, cur = (U.f[k] || []).slice(), i = cur.indexOf(el.value); if (el.checked && i < 0) cur.push(el.value); if (!el.checked && i >= 0) cur.splice(i, 1); U.f[k] = cur; render(); };
ACT['d-settle'] = el => {
  const g = gameBy(el.dataset.a), ch = fv('dchoice-' + g.no, Object.keys(g.subs)[0] ? 'a:' + Object.keys(g.subs)[0] : 'other');
  const w = ch === 'other' ? (U.f['dw-' + g.no] || []) : g.subs[ch.slice(2)];
  const r = settleGame(g.no, w || []); if (r.ok) { U.f['dw-' + g.no] = null; U.f['dchoice-' + g.no] = null; U.dsel = null; } res(r);
};
ACT['d-cancel'] = () => { location.hash = '#/admin/disputes'; render(); };
ACT.reopen = el => res(reopenGame(el.dataset.a));
/* fix it */
ACT['fx-save-seats'] = el => {
  const g = gameBy(el.dataset.a), cur = U.fxSeats.seats;
  g.seats.forEach((s, i) => {
    const c = cur[i];
    if (s.pid !== c.pid) { logit('Games', 'table ' + g.no + ', seat ' + s.seat + ' player', pname(s.pid), pname(c.pid)); g.hist.push({ who: me().name, text: 'replaced ' + pname(s.pid) + ' with ' + pname(c.pid) + ' in seat ' + s.seat, at: now() }); s.pid = c.pid; }
    if (s.f !== c.f) { logit('Games', 'table ' + g.no + ', seat ' + s.seat + ' faction', FA[s.f].name, FA[c.f].name); s.f = c.f; }
  });
  U.fxSeats = null; save(); toast('Saved. The edit is in the log.'); render();
};
ACT['fx-cancel-seats'] = () => { U.fxSeats = null; render(); };
ACT['fx-set-sub'] = el => {
  const g = gameBy(el.dataset.a), [pid, sel] = el.dataset.b.split('|'), v = val(sel), old = g.subs[pid];
  if (v) g.subs[pid] = [v]; else delete g.subs[pid];
  logit('Results', 'Table ' + g.no + ': ' + pname(pid) + '\'s answer', old ? old.map(pname).join(', ') : 'none', v ? pname(v) : 'none'); g.hist.push({ who: me().name, text: 'edited ' + pname(pid) + '\'s answer', at: now() }); save(); toast('Saved. The edit is in the log.'); render();
};
ACT['fx-void'] = el => res(setVoid(el.dataset.a, el.dataset.b === '1'));
ACT['fx-pick-del'] = el => { const p = SE().picks[+el.dataset.a]; logit('Pickems', 'Deleted ' + nameOfAcct(p.acct) + '\'s pick on table ' + p.game, pname(p.first) + (p.second ? ', ' + pname(p.second) : ''), ''); SE().picks.splice(+el.dataset.a, 1); save(); toast('Pick deleted.'); render(); };
ACT['fx-rename'] = el => { const p = person(el.dataset.a); ask({ title: 'Rename', input: { label: 'Name', value: p.name }, ok: 'Save', cb: v => { if (!v.trim()) return; logit('People', 'Renamed', p.name, v.trim()); p.name = v.trim(); save(); } }); };
ACT['fx-link'] = () => { const p = person(val('lk-p')), w = wlOf(val('lk-w')); p.did = w.id; logit('People', 'Linked sign-in ' + w.id + ' to ' + p.name, '', p.name); save(); toast('Linked.'); render(); };
ACT['fx-person-del'] = el => {
  const pid = el.dataset.a, se = SE(), seated = se.games.filter(g => seatOf(g, pid)).length;
  if (seated) return toast(pname(pid) + ' is seated at ' + plural(seated, 'game') + '. Replace them in the games first.', true);
  const picks = se.picks.filter(p => p.first === pid || p.second === pid || p.acct === (person(pid) || {}).did).length;
  const subs = se.games.reduce((n, g) => n + (g.subs[pid] ? 1 : 0), 0);
  ask({ title: 'Delete ' + pname(pid) + '?', body: '<p>This removes ' + plural(picks, 'pick\'em pick') + ', ' + plural(subs, 'submission') + ' and their roster place.</p>', ok: 'Delete person', danger: true, cb: () => {
    const pr = person(pid);
    se.picks = se.picks.filter(p => !(p.first === pid || p.second === pid || p.acct === pr.did));
    se.games.forEach(g => { delete g.subs[pid]; Object.keys(g.subs).forEach(k => { g.subs[k] = g.subs[k].filter(x => x !== pid); if (!g.subs[k].length) delete g.subs[k]; }); });
    se.league = se.league.filter(x => x !== pid); se.wait = se.wait.filter(x => x !== pid); delete se.lists[pid];
    S.people = S.people.filter(p => p.id !== pid); logit('People', 'Deleted ' + pr.name, plural(picks, 'pick') + ', ' + plural(subs, 'submission'), ''); save(); toast('Deleted.');
  } });
};
ACT['fx-l-up'] = el => { const c = U.fxList.codes, i = +el.dataset.a; [c[i - 1], c[i]] = [c[i], c[i - 1]]; render(); };
ACT['fx-l-down'] = el => { const c = U.fxList.codes, i = +el.dataset.a; [c[i + 1], c[i]] = [c[i], c[i + 1]]; render(); };
ACT['fx-l-rm'] = el => { U.fxList.codes.splice(+el.dataset.a, 1); render(); };
ACT['fx-l-add'] = () => { const v = val('fx-add'); if (v) U.fxList.codes.push(v); render(); };
ACT['fx-l-cancel'] = () => { U.fxList = null; render(); };
ACT['fx-l-save'] = el => { const pid = el.dataset.a, se = SE(), old = listOf(pid); logit('Lists', pname(pid) + ' ranked list', old.codes.map(c => FA[c].name).join(', '), U.fxList.codes.map(c => FA[c].name).join(', ')); se.lists[pid] = { codes: U.fxList.codes.slice(), st: old.st }; U.fxList = null; save(); toast('Saved. The edit is in the log.'); render(); };
/* csv */
ACT['csv-picks'] = () => download('faction-picks.csv', exportPicksCsv());
ACT['csv-state'] = () => download('league-state.zip', zipStore(exportFiles()));
ACT['csv-confirm'] = () => { applyImport(U.csvPlan); U.csvPlan = null; toast('Imported. One entry is in the log.'); render(); };
ACT['csv-cancel'] = () => { U.csvPlan = null; render(); };
async function readFiles(list) {
  const files = {};
  try {
    for (const f of list) {
      if (/\.zip$/i.test(f.name)) Object.assign(files, await unzip(await f.arrayBuffer()));
      else files[f.name] = await f.text();
    }
    U.csvPlan = importPlan(files);
    if (U.csvPlan.errs.length === 0) U.csvPlan.names = Object.keys(files);
  } catch (e) { U.csvPlan = { errs: [{ file: 'zip', msg: e.message }] }; }
  render();
}

/* ---------- event wiring ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-pb]'); if (!t) return;
  if (t.dataset.pb) return pbAct(t, ev);
  const tn = t.tagName, ty = t.type;
  if (tn === 'SELECT' || ty === 'checkbox' || ty === 'radio' || ty === 'file') return;
  const f = ACT[t.dataset.act]; if (f) { ev.preventDefault && t.tagName === 'A' && ev.preventDefault(); f(t, ev); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.pb) return pbChange(t);
  const a = t.dataset.act;
  if (a === 'chk') { t.closest('.chk').classList.toggle('on', t.checked); return; }
  if (a === 'pick-radio') { U.f[t.dataset.a + '-' + route().parts[1]] = t.value; U.keepFocus = false; return render(); }
  if (a === 'sd-pool' || a === 'sd-cap' || a === 'sd-games' || a === 'd-choice' || a === 'd-win') return ACT[a](t);
  if (a === 'fx-game') { U.f['fx-game'] = t.value; U.fxSeats = null; return render(); }
  if (a === 'fx-seat') { const g = gameBy(U.f['fx-game'] || (SE().games[Math.min(6, SE().games.length - 1)] || {}).no); if (!U.fxSeats || U.fxSeats.no !== g.no) U.fxSeats = { no: g.no, seats: g.seats.map(s => ({ seat: s.seat, pid: s.pid, f: s.f })) }; U.fxSeats.seats[+t.dataset.a][t.dataset.b] = t.value; return render(); }
  if (a === 'fx-person') { U.f['fx-person'] = t.value; U.fxList = null; return render(); }
  if (a === 'fx-place') { const pid = t.dataset.a, se = SE(), v = t.value, old = onList(pid); se.league = se.league.filter(x => x !== pid); se.wait = se.wait.filter(x => x !== pid); if (v === 'league') se.league.push(pid); else if (v === 'wait') se.wait.push(pid); logit('Roster', pname(pid) + ' (Fix it)', old || 'none', v); save(); toast('Saved. The edit is in the log.'); return render(); }
  if (a === 'csv-files') return readFiles(Array.from(t.files));
  if (t.dataset.sd) { U.sd[t.dataset.sd] = t.value; if (t.tagName === 'SELECT') { U.sd.cap = +U.sd.cap; U.sd.games = +U.sd.games; } }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.u) U.f[t.dataset.u] = t.value;
  if (t.dataset.sd) U.sd[t.dataset.sd] = t.value;
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && U.modal) { closeModal(); }
  if (ev.key === 'Enter' && U.modal && ev.target.id === 'm-in') { ev.preventDefault(); modalOk(); }
});
function modalOk() { const o = U.modal; if (!o) return; const v = $('#m-in') ? $('#m-in').value : ''; closeModal(); o.cb && o.cb(v); render(); }
ACT['modal-ok'] = modalOk;
ACT['modal-cancel'] = closeModal;
document.addEventListener('dragstart', ev => { const r = ev.target.closest && ev.target.closest('[data-drag]'); if (r) { dragPid = r.dataset.drag; try { ev.dataTransfer.setData('text/plain', dragPid); ev.dataTransfer.effectAllowed = 'move'; } catch (e) { /* ok */ } } });
document.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('[data-drop]'); if (d && dragPid) { ev.preventDefault(); document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); d.classList.add('drop'); } });
document.addEventListener('drop', ev => { if (!dragPid) return; ev.preventDefault(); document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); dropOn(ev.target); });
document.addEventListener('dragend', () => { dragPid = null; document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });
window.addEventListener('hashchange', render);

function pbAct(t) {
  const a = t.dataset.pb;
  if (a === 'toggle') { U.barOpen = !U.barOpen; return renderBar(); }
  if (a === 'time') { S.clock += +t.dataset.a * HOUR; save(); return render(); }
  if (a === 'lock') { const d = SE().lockAt - now(); if (d > 0) S.clock += d + 60000; save(); return render(); }
  if (a === 'real') { S.clock = 0; save(); return render(); }
  if (a === 'theme') { S.theme = t.dataset.a; save(); return render(); }
  if (a === 'reset') { const v = $('#pb-start').value; const th = S.theme; cancelRun(); Object.keys(U).forEach(k => { if (k !== 'barOpen') delete U[k]; }); U.f = {}; U.menu = false; resetState(v); S.theme = th; save(); location.hash = '#/'; render(); toast('Demo data reset: ' + (v === 'mid' ? 'mid-season' : 'pre-season') + '.'); }
}
function pbChange(t) {
  if (t.dataset.pb === 'persona') setPersona(t.value);
  if (t.dataset.pb === 'name') { S.persona.name = t.value; save(); location.hash = '#/'; render(); }
}

/* ---------- boot ---------- */
function boot() {
  S = loadState() || seedState('pre');
  window.__rl = { get S() { return S; }, exportFiles, importPlan, applyImport, exportPicksCsv, zipStore, unzip, seedState, resetState: s => { resetState(s); render(); }, me, stage, standings, leaderboard, gstate, render, csvParse };
  render();
  setInterval(() => {
    if (!S) return;
    if (U.stage !== stage()) return render();
    document.querySelectorAll('[data-cd]').forEach(e => { e.textContent = fmtCd(+e.dataset.cd - now()); });
  }, 15000);
}
boot();

</script>
