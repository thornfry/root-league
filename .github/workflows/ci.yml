name: CI

on:
  push:
    paths:
      - 'site/**'
      - 'planning/tools/pairing/**'
      - 'league/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The e2e specs run locally on request (decision 57); CI only checks they still compile.
      - run: npm run e2e:typecheck
      - run: npm run build
      - name: Production build has no dev sign-in reference
        run: "! grep -r 'dev.invalid' dist"
      - name: Production build has no dev sign-in stand-in
        run: npm run check:no-dev

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planning/tools/pairing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m unittest
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install parity wrapper dependencies
        working-directory: site
        run: npm ci
      - name: Cross-check pairing hard rules in both directions
        working-directory: site
        run: python3 scripts/parity.py

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local Supabase stack
        run: npm run db:start
      - name: Apply migrations and seed
        run: npm run db:reset
      - name: pgTAP tests
        run: npm run db:test
      - name: Generated types are current
        run: npm run db:types:check
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
