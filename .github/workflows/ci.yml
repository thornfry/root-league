name: CI

on:
  push:
    paths:
      - 'site/**'
      - 'planning/tools/pairing/**'
      - 'league/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production build has no dev sign-in reference
        run: "! grep -r 'dev.invalid' dist"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planning/tools/pairing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m unittest
