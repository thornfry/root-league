name: CI

on:
  push:
    paths:
      - 'site/**'
      - 'planning/tools/pairing/**'
      - 'planning/season-1/**'
      - 'league/**'
      - 'season-1/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: TypeScript unit tests
        env:
          SEED_TEST_DATABASE_URL: ''
        run: >-
          npm test --
          --exclude scripts/build-guards.test.ts
          --exclude src/pairing/parity.test.ts

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planning/tools/pairing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m unittest
